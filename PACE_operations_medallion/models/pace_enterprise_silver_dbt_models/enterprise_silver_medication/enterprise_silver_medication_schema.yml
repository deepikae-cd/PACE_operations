version: 2

models:

  - name: enterprise_silver_medication
    description: >
      Cleaned, deduplicated, and enriched medication records sourced from
      STG_MEDICATION. Standardises drug attributes, pharmacy details, and
      prescription lifecycle while computing adherence, refill tracking,
      and clinical safety indicators.

    config:
      schema: enterprise_silver_medication
      alias: medication
      materialized: incremental
      unique_key: medication_sk
      incremental_strategy: merge
      tags: ["silver", "medication"]
      on_schema_change: sync_all_columns

    columns:
      - name: medication_sk
        description: Surrogate key for medication record.
        tests: [not_null, unique]

      - name: medication_id
        description: Natural identifier of medication record.
        tests: [not_null]

      - name: participant_id
        description: Participant receiving medication.

      - name: provider_id
        description: Prescribing provider identifier.

      - name: visit_id
        description: Associated clinical visit.

      - name: medication_name
        description: Name of the medication.

      - name: generic_name
        description: Generic drug name.

      - name: brand_name
        description: Brand name.

      - name: ndc_code
        description: National Drug Code.

      - name: drug_class
        description: Drug classification.

      - name: dosage
        description: Dosage amount.

      - name: dosage_unit
        description: Units of dosage.

      - name: frequency
        description: Administration frequency.

      - name: route
        description: Route of administration.

      - name: prescribed_date
        description: Date medication was prescribed.

      - name: start_date
        description: Start date of medication therapy.

      - name: end_date
        description: End date of medication therapy.

      - name: medication_status
        description: Normalised medication status.

      - name: refills_authorized
        description: Number of authorized refills.

      - name: refills_remaining
        description: Remaining refills.

      - name: last_refill_date
        description: Timestamp of last refill.

      - name: pharmacy_name
        description: Pharmacy name.

      - name: pharmacy_id
        description: Pharmacy identifier.

      - name: pharmacy_npi
        description: Pharmacy NPI.

      - name: pharmacy_phone
        description: Pharmacy phone number.

      - name: pharmacy_address
        description: Pharmacy address.

      - name: dispensed_quantity
        description: Quantity dispensed.

      - name: days_supply
        description: Days of supply.

      - name: is_controlled_substance
        description: TRUE if controlled substance.

      - name: dea_schedule
        description: DEA classification.

      - name: prior_auth_required_flag
        description: TRUE if prior authorization required.

      - name: prior_authorization_status
        description: Prior authorization status.

      - name: adverse_reactions
        description: Known adverse reactions.

      - name: contraindications
        description: Contraindications.

      - name: interaction_alerts
        description: Drug interaction alerts.

      - name: administration_instructions
        description: Instructions for administration.

      - name: special_handling_notes
        description: Special handling requirements.

      - name: is_pace_formulary
        description: TRUE if part of PACE formulary.

      - name: formulary_tier
        description: Formulary tier level.

      - name: cost_per_unit
        description: Cost per unit.

      - name: total_cost
        description: Total medication cost.

      - name: coverage_type
        description: Insurance coverage type.

      - name: center_id
        description: PACE center identifier.

      - name: source_system
        description: Origin system.

      - name: loaded_timestamp
        description: Bronze ingestion timestamp.

      - name: source_file
        description: Source file identifier.

      - name: dbt_updated_timestamp
        description: DBT update timestamp.
