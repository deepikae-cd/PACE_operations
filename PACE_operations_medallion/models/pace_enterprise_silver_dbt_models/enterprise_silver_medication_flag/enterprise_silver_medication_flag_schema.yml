version: 2

models:
  - name: enterprise_silver_medication_flag
    description: >
      Silver model providing participant-level medication risk indicator.
      Identifies whether a participant is on high-risk timed medications.

    config:
      materialized: view
      schema: enterprise_silver_medication_flag
      alias: medication_flag
      tags: ['silver', 'medication', 'risk']

    columns:
      - name: participant_id
        description: Unique identifier for participant
       

      - name: has_high_risk_timed_med
        description: >
          Indicator (1/0) showing whether participant has at least one
          high-risk timed medication
      