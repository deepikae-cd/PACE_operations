version: 2

models:

  - name: enterprise_silver_organization
    description: >
      Cleaned, deduplicated, and enriched organization and service area records.
      Computes accreditation, contract lifecycle, enrollment utilization,
      audit recency, and service capability attributes.

    config:
      schema: enterprise_silver_organization
      alias: organization
      materialized: table
      tags: ["silver", "organization"]
      on_schema_change: sync_all_columns

    columns:
      - name: organization_sa_sk
        description: Surrogate key for organization + service area.
        tests: [not_null, unique]

      - name: organization_id
        description: Organization identifier.
        tests: [not_null]

      - name: center_id
        description: Center identifier.

      - name: service_area_id
        description: Service area identifier.

      - name: is_child_organization_flag
        description: TRUE if organization has parent.

      - name: organization_name
        description: Organization name.

      - name: organization_type
        description: Organization classification.

      - name: accreditation_status
        description: Standardized accreditation status.

      - name: is_accredited_flag
        description: TRUE if accredited.

      - name: is_accreditation_expired_flag
        description: TRUE if expired.

      - name: center_name
        description: Center name.

      - name: center_full_address
        description: Full formatted address.

      - name: center_status
        description: Center status.

      - name: is_center_active_flag
        description: TRUE if center is active.

      - name: population_served
        description: Population served.

      - name: enrolled_count
        description: Enrolled participants.

      - name: enrollment_capacity
        description: Maximum enrollment.

      - name: enrollment_utilisation_rate
        description: Enrollment utilization ratio.

      - name: is_at_capacity_flag
        description: TRUE if at capacity.

      - name: contract_status
        description: Contract status.

      - name: is_contract_active_flag
        description: TRUE if active contract.

      - name: is_contract_expiring_soon_flag
        description: TRUE if expiring within 90 days.

      - name: core_service_count
        description: Count of services offered.

      - name: is_transportation_available_flag
        description: Transportation availability.

      - name: is_meal_service_available_flag
        description: Meal service availability.

      - name: is_pharmacy_on_site_flag
        description: Pharmacy availability.

      - name: is_home_care_available_flag
        description: Home care availability.

      - name: is_cms_audit_overdue_flag
        description: TRUE if CMS audit overdue.

      - name: is_state_audit_overdue_flag
        description: TRUE if state audit overdue.

      - name: days_since_cms_audit
        description: Days since CMS audit.

      - name: quality_rating
        description: Quality rating.

      - name: quality_rating_tier
        description: Categorized rating.

      - name: source_system
        description: Source system.

      - name: loaded_timestamp
        description: Bronze ingestion timestamp.

      - name: source_file
        description: Source file.

      - name: dbt_updated_timestamp
        description: DBT update timestamp.