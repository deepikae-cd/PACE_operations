version: 2

models:

  - name: enterprise_silver_idt_clinical
    description: >
      Cleaned, deduplicated, and enriched clinical visit records sourced from
      STG_CLINICAL_VISIT. Standardises visit attributes, validates vitals ranges,
      derives diagnosis/procedure counts, and computes follow-up and acuity flags.

    config:
      schema: enterprise_silver_idt_clinical
      alias: idt_clinical
      materialized: incremental
      unique_key: visit_sk
      incremental_strategy: merge
      tags: ["silver", "clinical"]
      on_schema_change: sync_all_columns

    columns:
      - name: visit_sk
        description: Surrogate key for clinical visit.


      - name: visit_id
        description: Natural identifier of visit.


      - name: appointment_id
        description: Linked appointment identifier (if scheduled visit).

      - name: participant_id
        description: Participant receiving care.
        tests: [not_null]

      - name: provider_id
        description: Care provider identifier.

      - name: caregiver_id
        description: Assigned caregiver.

      - name: center_id
        description: PACE center identifier.

      - name: is_scheduled_visit_flag
        description: TRUE if visit is linked to an appointment.

      - name: visit_type
        description: Normalised visit type.

      - name: location_type
        description: Normalised visit location.

      - name: is_high_acuity_location_flag
        description: TRUE if visit occurred in ER or hospital setting.

      - name: chief_complaint
        description: Reason for visit.

      - name: primary_diagnosis_code
        description: Primary diagnosis code (ICD-10).

      - name: primary_diagnosis_desc
        description: Description of primary diagnosis.

      - name: primary_diagnosis_chapter
        description: Derived ICD-10 chapter classification.

      - name: secondary_diagnosis_codes
        description: Pipe-delimited list of secondary diagnoses.

      - name: procedures_performed
        description: Pipe-delimited procedures performed.

      - name: medications_prescribed
        description: Pipe-delimited medications prescribed.

      - name: secondary_diagnosis_count
        description: Count of secondary diagnoses.

      - name: procedure_count
        description: Count of procedures performed.

      - name: has_procedures_flag
        description: TRUE if procedures were performed.

      - name: vitals_blood_pressure
        description: Blood pressure reading.

      - name: vitals_heart_rate
        description: Heart rate value.

      - name: vitals_temperature
        description: Body temperature.

      - name: vitals_weight_lbs
        description: Weight in pounds.

      - name: vitals_o2_saturation
        description: Oxygen saturation percentage.

      - name: is_vitals_complete_flag
        description: TRUE if all vitals are present.

      - name: is_heart_rate_abnormal_flag
        description: TRUE if heart rate is outside normal range.

      - name: is_temperature_abnormal_flag
        description: TRUE if temperature is outside normal range.

      - name: is_o2_low_flag
        description: TRUE if oxygen saturation is below threshold.

      - name: clinical_notes
        description: Clinical notes from visit.

      - name: follow_up_required
        description: Indicates whether follow-up is required.

      - name: follow_up_timeframe_days
        description: Days until follow-up is due.

      - name: follow_up_due_date
        description: Calculated follow-up due date.

      - name: is_follow_up_overdue_flag
        description: TRUE if follow-up is overdue.

      - name: visit_date
        description: Visit date and time.

      - name: visit_duration_minutes
        description: Duration of visit in minutes.

      - name: is_long_visit_flag
        description: TRUE if visit duration exceeds 60 minutes.

      - name: source_system
        description: Origin system.

      - name: loaded_timestamp
        description: Bronze ingestion timestamp.

      - name: source_file
        description: Source file identifier.

      - name: dbt_updated_timestamp
        description: DBT model update timestamp.