version: 2

models:
  - name: enterprise_silver_transportation

    description: >
      Cleaned, deduplicated, and enriched transportation records sourced from
      STG_TRANSPORTATION. Standardises trip attributes and computes flags for
      trip outcomes, punctuality, SLA compliance, and operational metrics.

    config:
      schema: enterprise_silver_transportation
      alias: transportation
      materialized: incremental
      unique_key: transport_sk
      incremental_strategy: merge
      on_schema_change: sync_all_columns
      tags: ['silver', 'transportation']

    columns:

      # ───────────────────────────────
      # Keys
      # ───────────────────────────────
      - name: transport_sk
        description: Surrogate key for transportation record.
        tests:
          - not_null
          - unique

      - name: transportation_id
        description: Natural identifier for transportation record.
        tests:
          - not_null

      - name: participant_id
        description: Participant identifier.

      - name: appointment_id
        description: Related appointment identifier.

      - name: driver_id
        description: Driver identifier.

      - name: vehicle_id
        description: Vehicle identifier.

      - name: vendor_id
        description: Vendor identifier.

      - name: center_id
        description: PACE center identifier.

      # ───────────────────────────────
      # Trip Details
      # ───────────────────────────────
      - name: transport_type
        description: Standardized transport type.

      - name: transport_type_rank
        description: Priority ranking of transport type.

      - name: trip_direction
        description: Direction of trip (OUTBOUND, RETURN).

      - name: trip_status
        description: Standardized trip status.

      - name: is_scheduled_flag
        description: TRUE if trip is scheduled.

      - name: is_completed_flag
        description: TRUE if trip is completed.

      - name: is_cancelled_flag
        description: TRUE if trip is cancelled.

      - name: is_no_show_flag
        description: TRUE if participant did not show.

      - name: is_in_progress_flag
        description: TRUE if trip is in progress.

      - name: is_unsuccessful_flag
        description: TRUE if trip failed (cancelled or no-show).

      # ───────────────────────────────
      # Cancellation
      # ───────────────────────────────
      - name: cancellation_reason
        description: Reason for cancellation.

      - name: is_cancelled_with_reason_flag
        description: TRUE if cancellation reason provided.

      # ───────────────────────────────
      # Equipment
      # ───────────────────────────────
      - name: special_equipment_needed
        description: Standardized equipment requirement.

      - name: requires_special_equipment_flag
        description: TRUE if special equipment required.

      # ───────────────────────────────
      # Locations
      # ───────────────────────────────
      - name: pickup_location
        description: Pickup location.

      - name: dropoff_location
        description: Drop-off location.

      # ───────────────────────────────
      # Timestamps & Metrics
      # ───────────────────────────────
      - name: ride_date
        description: Scheduled pickup timestamp.

      - name: actual_pickup_time
        description: Actual pickup timestamp.

      - name: actual_dropoff_time
        description: Actual drop-off timestamp.

      - name: pickup_delay_minutes
        description: Delay between scheduled and actual pickup.

      - name: trip_duration_minutes
        description: Duration of trip in minutes.

      - name: is_on_time_flag
        description: TRUE if pickup within SLA window.

      - name: is_late_pickup_flag
        description: TRUE if pickup delay exceeds threshold.

      - name: is_sla_breached_flag
        description: TRUE if SLA conditions are violated.

      # ───────────────────────────────
      # Distance
      # ───────────────────────────────
      - name: mileage
        description: Distance traveled.

      - name: mileage_band
        description: Categorized distance band.

      # ───────────────────────────────
      # Date Dimensions
      # ───────────────────────────────
      - name: trip_date
        description: Trip date (day-level).

      - name: trip_month
        description: Trip month.

      - name: trip_day_of_week
        description: Day of week for trip.

      - name: scheduled_pickup_hour
        description: Hour of scheduled pickup.

      # ───────────────────────────────
      # Metadata
      # ───────────────────────────────
      - name: source_system
        description: Source system name.

      - name: loaded_timestamp
        description: Timestamp when record was loaded.

      - name: source_file
        description: Source file identifier.

      - name: dbt_updated_timestamp
        description: Timestamp when dbt last updated the record.