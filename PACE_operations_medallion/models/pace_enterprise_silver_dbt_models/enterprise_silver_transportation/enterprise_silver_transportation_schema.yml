version: 2

models:
  - name: enterprise_silver_transportation

    description: >
      Cleaned, deduplicated, and enriched transportation records sourced from
      STG_TRANSPORTATION. Applies standardization, derives operational metrics,
      and prepares data for downstream analytics and fact models.

    config:
      schema: enterprise_silver_transportation
      alias: transportation
      materialized: incremental
      unique_key: transport_sk
      incremental_strategy: merge
      on_schema_change: sync_all_columns
      tags: ['silver', 'transportation']

    columns:

      - name: transport_sk
        description: Surrogate key uniquely identifying each transportation record.
        tests: [not_null, unique]

      - name: transportation_id
        description: Natural business identifier for the transportation record.

      - name: participant_id
        description: Identifier of the participant associated with the trip.

      - name: appointment_id
        description: Identifier of the related appointment, if applicable.

      - name: driver_id
        description: Identifier of the assigned driver.

      - name: vehicle_id
        description: Identifier of the vehicle used for the trip.

      - name: vendor_id
        description: Identifier of the transportation vendor.

      - name: center_id
        description: Identifier of the PACE center managing the trip.

      - name: transport_type
        description: Standardized category of transportation service (e.g., Ambulance, Sedan).

      - name: transport_type_rank
        description: Priority ranking assigned to transport types for reporting and sorting.

      - name: trip_direction
        description: Direction of the trip (OUTBOUND or RETURN).

      - name: trip_status
        description: Standardized lifecycle status of the transportation trip.

      - name: is_scheduled_flag
        description: Indicates if the trip is currently scheduled.

      - name: is_completed_flag
        description: Indicates if the trip has been successfully completed.

      - name: is_cancelled_flag
        description: Indicates if the trip was cancelled.

      - name: is_no_show_flag
        description: Indicates if the participant did not show up for the trip.

      - name: is_in_progress_flag
        description: Indicates if the trip is currently in progress.

      - name: is_unsuccessful_flag
        description: Indicates unsuccessful trips (cancelled or no-show).

      - name: cancellation_reason
        description: Text description explaining why the trip was cancelled.

      - name: is_cancelled_with_reason_flag
        description: Indicates whether a cancellation reason was provided.

      - name: special_equipment_needed
        description: Standardized equipment requirement for the trip (e.g., wheelchair lift).

      - name: requires_special_equipment_flag
        description: Indicates if special equipment is required for the trip.

      - name: pickup_location
        description: Normalized pickup location for the trip.

      - name: dropoff_location
        description: Normalized drop-off location for the trip.

      - name: ride_date
        description: Scheduled date and time for the trip pickup.

      - name: actual_pickup_time
        description: Actual timestamp when the participant was picked up.

      - name: actual_dropoff_time
        description: Actual timestamp when the participant was dropped off.

      - name: pickup_delay_minutes
        description: Difference in minutes between scheduled and actual pickup times.

      - name: trip_duration_minutes
        description: Total duration of the trip in minutes.

      - name: is_on_time_flag
        description: Indicates if pickup occurred within acceptable SLA time window.

      - name: is_late_pickup_flag
        description: Indicates if pickup exceeded the allowed delay threshold.

      - name: is_sla_breached_flag
        description: Indicates if SLA conditions for pickup timeliness were violated.

      - name: mileage
        description: Distance traveled during the trip in miles.

      - name: mileage_band
        description: Categorized grouping of mileage into reporting bands.

      - name: trip_date
        description: Date component of the trip for reporting.

      - name: trip_month
        description: Month component of the trip for aggregation.

      - name: trip_day_of_week
        description: Day of the week the trip occurred.

      - name: scheduled_pickup_hour
        description: Hour of the day when the trip was scheduled.

      - name: source_system
        description: Source system from which the data originated.

      - name: loaded_timestamp
        description: Timestamp when the record was ingested into the warehouse.

      - name: source_file
        description: Source file name or identifier for lineage tracking.

      - name: dbt_updated_timestamp
        description: Timestamp when dbt last updated the record.