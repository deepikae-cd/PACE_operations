version: 2

models:
  - name: enterprise_silver_provider_credential
    description: >
      Silver-layer provider credential dataset that standardizes raw credential
      data, removes duplicates, and enriches records with expiry logic and
      compliance flags. Serves as the source for gold-layer credential models.

    config:
      materialized: incremental
      schema: enterprise_silver_provider_credential
      alias: provider_credential
      tags:
        - silver
        - provider
        - credential

    columns:

      - name: provider_credential_sk
        description: Surrogate key for provider credential record.
        tests:
          - not_null
          - unique

      - name: provider_id
        description: Unique provider identifier.
        tests:
          - not_null

      - name: credential_id
        description: Unique credential identifier.
        tests:
          - not_null

      - name: credential_type
        description: Type of credential (e.g., License, Certification).

      - name: credential_name
        description: Human-readable credential name.

      - name: credential_status
        description: Standardized credential status.

      - name: issue_date
        description: Date credential was issued.

      - name: expiration_date
        description: Credential expiration date.

      - name: days_until_expiry
        description: Number of days remaining until expiration.

      - name: is_expired_flag
        description: Indicates expired credentials.

      - name: is_expiring_soon_flag
        description: Indicates credentials expiring within 30 days.

      - name: is_valid_flag
        description: Indicates currently valid credential.

      - name: is_missing_expiration_flag
        description: Indicates missing expiration date.

      - name: source_system
        description: Source system identifier.

      - name: loaded_timestamp
        description: Timestamp of ingestion.

      - name: source_file
        description: Original source file name.