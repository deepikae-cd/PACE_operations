version: 2

models:
  - name: enterprise_silver_provider
    description: >
      Cleaned, deduplicated, and enriched provider records sourced from
      STG_PROVIDER. Standardises provider attributes and computes
      network status, contract lifecycle flags, and capability indicators.

    config:
      schema: enterprise_silver_provider
      alias: provider
      materialized: incremental
      unique_key: provider_sk
      incremental_strategy: merge
      on_schema_change: sync_all_columns
      tags:
        - silver
        - provider

    columns:

      # ───────────────────────────────
      # Keys
      # ───────────────────────────────
      - name: provider_sk
        description: Surrogate key for provider record.
        tests:
          - not_null
          - unique

      - name: provider_id
        description: Natural identifier for provider.
        tests:
          - not_null

      - name: npi_number
        description: National Provider Identifier.

      - name: tax_id
        description: Tax identification number.

      - name: center_id
        description: Associated PACE center identifier.

      # ───────────────────────────────
      # Provider Details
      # ───────────────────────────────
      - name: provider_name
        description: Provider name.

      - name: provider_type
        description: Standardized provider type.

      - name: provider_subtype
        description: Standardized provider subtype.

      - name: specialty
        description: Medical specialty.

      # ───────────────────────────────
      # Network Status
      # ───────────────────────────────
      - name: network_status
        description: Standardized network participation status.

      - name: is_in_network_flag
        description: TRUE if provider is in-network.

      - name: is_out_of_network_flag
        description: TRUE if provider is out-of-network.

      - name: is_preferred_flag
        description: TRUE if provider is preferred.

      # ───────────────────────────────
      # Contract Lifecycle
      # ───────────────────────────────
      - name: contract_start_date
        description: Contract start date.

      - name: contract_end_date
        description: Contract end date.

      - name: is_contract_active_flag
        description: TRUE if contract is currently active.

      - name: contract_duration_days
        description: Total contract duration.

      - name: days_until_contract_expiry
        description: Number of days remaining until contract expiration.

      - name: is_contract_expiring_soon_flag
        description: TRUE if contract expires within 30 days.

      # ───────────────────────────────
      # Address & Contact
      # ───────────────────────────────
      - name: address_line1
        description: Address line 1.

      - name: city
        description: City.

      - name: state
        description: State code.

      - name: zip_code
        description: ZIP code.

      - name: phone_number
        description: Contact phone number.

      - name: fax_number
        description: Fax number.

      # ───────────────────────────────
      # Capability Flags
      # ───────────────────────────────
      - name: accepts_telehealth_flag
        description: TRUE if telehealth services are supported.

      - name: accepts_pace_patients_flag
        description: TRUE if provider accepts PACE participants.

      - name: is_preferred_active_pace_flag
        description: TRUE if provider is preferred, active, and accepts PACE.

      # ───────────────────────────────
      # Metadata
      # ───────────────────────────────
      - name: source_system
        description: Source system name.

      - name: loaded_timestamp
        description: Bronze ingestion timestamp.

      - name: source_file
        description: Source file identifier.

      - name: dbt_updated_timestamp
        description: DBT update timestamp.
