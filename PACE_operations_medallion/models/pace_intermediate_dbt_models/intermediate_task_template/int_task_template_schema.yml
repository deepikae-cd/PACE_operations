version: 2

models:
  - name: int_task_template

    description: >
      Intermediate model that joins task instances with task templates
      to enrich each task with task name and task category. Provides
      categorized task data for downstream analytics.

    config:
      materialized: view
      schema: intermediate_task_template
      alias: task_template
      tags: ['intermediate', 'task', 'pace']

    columns:

      # ─────────────────────────────────────────────
      # Keys
      # ─────────────────────────────────────────────
      - name: task_instance_id
        description: Unique identifier for task instance
        tests:
          - not_null

      - name: care_plan_activity_id
        description: Identifier linking task to care plan activity

      - name: task_template_id
        description: Identifier linking task instance to task template

      # ─────────────────────────────────────────────
      # Metrics
      # ─────────────────────────────────────────────
      - name: actual_duration_minutes
        description: Duration of task in minutes

      - name: performed_at
        description: Timestamp when task was performed

      # ─────────────────────────────────────────────
      # Template enrichment
      # ─────────────────────────────────────────────
      - name: task_name
        description: Name of the task

      - name: task_category
        description: Category of task (MEDICATION_ASSISTANCE, BATHING, etc.)

      # ─────────────────────────────────────────────
      # Metadata
      # ─────────────────────────────────────────────
      - name: source_system
        description: Source system from which data originated

      - name: loaded_at
        description: Timestamp when record was loaded from staging