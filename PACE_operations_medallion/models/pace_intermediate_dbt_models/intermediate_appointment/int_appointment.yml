version: 2

models:
  - name: int_appointment
    description: >
      Enriches enterprise silver appointment data with participant,
      provider, and caregiver context. Applies PACE-specific business
      logic for appointment classification, attendance status resolution,
      and care coordination flags.

    config:
      materialized: view
      schema: intermediate_appointment
      alias: appointment
      tags: ['intermediate', 'appointment', 'pace']


    columns:

      # ─────────────────────────────────────────────
      # Keys
      # ─────────────────────────────────────────────
      - name: appointment_id
        description: Unique identifier for the appointment
        tests:
          - not_null
          - unique

      - name: participant_id
        description: Foreign key to participant

      - name: provider_id
        description: Foreign key to provider

      - name: organization_id
        description: Foreign key to organization

      # ─────────────────────────────────────────────
      # Core appointment fields
      # ─────────────────────────────────────────────
      - name: appointment_datetime
        description: Timestamp of scheduled appointment

      - name: appointment_date
        description: Date component of appointment

      - name: appointment_time
        description: Time component of appointment

      - name: scheduled_date
        description: Date when appointment was scheduled

      - name: appointment_category
        description: Derived PACE classification of appointment type
        tests:
          - accepted_values:
              values:
                - interdisciplinary_team
                - primary_care
                - specialist
                - behavioral_health
                - therapy
                - transportation_related
                - ancillary
                - adult_day_center
                - other

      - name: care_setting
        description: Derived care setting (in_person, telehealth, etc.)
        tests:
          - accepted_values:
              values:
                - in_person
                - telehealth
                - home_visit
                - inpatient
                - skilled_nursing
                - other

      # ─────────────────────────────────────────────
      # Attendance + status
      # ─────────────────────────────────────────────
      - name: attendance_status_normalized
        description: Standardized attendance classification
        tests:
          - accepted_values:
              values:
                - attended
                - no_show
                - cancelled
                - rescheduled
                - late_cancellation
                - upcoming
                - unknown

      - name: is_confirmed_no_show
        description: True if appointment is classified as no-show and in the past

      - name: is_missed_idt
        description: True if interdisciplinary team appointment was missed

      # ─────────────────────────────────────────────
      # Scheduling metrics
      # ─────────────────────────────────────────────
      - name: is_same_day_scheduled
        description: True if appointment scheduled for the same day

      - name: days_from_creation_to_appointment
        description: Days between record creation and appointment datetime

      # ─────────────────────────────────────────────
      # Participant
      # ─────────────────────────────────────────────
      - name: participant_full_name
        description: Full name of participant

      - name: date_of_birth
        description: Participant date of birth

      - name: participant_enrollment_status
        description: Enrollment status of participant

      - name: is_active_enrollee
        description: Flag indicating active enrollment

      # ─────────────────────────────────────────────
      # Provider
      # ─────────────────────────────────────────────
      - name: provider_full_name
        description: Full name of provider

      - name: provider_type_description
        description: Provider type classification

      - name: provider_specialty_description
        description: Provider specialty

      - name: is_active_provider
        description: Flag indicating active provider

      # ─────────────────────────────────────────────
      # Organization / PACE center
      # ─────────────────────────────────────────────
      - name: organization_name
        description: Name of organization

      - name: pace_center_name
        description: Name of PACE center

      - name: pace_center_city
        description: City of PACE center

      - name: pace_center_state
        description: State of PACE center

      # ─────────────────────────────────────────────
      # Caregiver
      # ─────────────────────────────────────────────
      - name: primary_caregiver_id
        description: Identifier for primary caregiver

      - name: primary_caregiver_full_name
        description: Full name of primary caregiver

      - name: primary_caregiver_relationship
        description: Relationship of caregiver to participant

      # ─────────────────────────────────────────────
      # Audit
      # ─────────────────────────────────────────────
      - name: created_at
        description: Record creation timestamp

      - name: updated_at
        description: Record update timestamp

      - name: source_system
        description: Source system of data

      - name: silver_loaded_at
        description: Timestamp when record was loaded into silver layer

      - name: int_loaded_at
        description: Timestamp when record was processed in intermediate layer