version: 2

models:
  - name: participant_trip_summary
    description: >
      Gold-layer model summarizing participant travel activity including
      total trips and status breakdown.

    columns:
      - name: participant_id
        tests:
          - not_null
          - unique

      - name: total_trips

      - name: completed_trips

      - name: delayed_trips

      - name: cancelled_trips

      - name: travel_flag