version: 2

models:
  - name: staging_task_instance

    description: >
      Staging model for task instance data. Cleans and standardizes
      raw task execution records from bronze by normalizing identifiers,
      converting duration and timestamps into proper types, and
      preserving ingestion metadata.

    config:
      materialized: view
      schema: staging_task_instance
      alias: task_instance
      tags: ['staging', 'task', 'pace']

    columns:

      # ─────────────────────────────────────────────
      # Keys
      # ─────────────────────────────────────────────
      - name: task_instance_id
        description: Unique identifier for the task instance
        tests:
          - not_null

      - name: care_plan_activity_id
        description: Identifier linking task instance to care plan activity
        tests:
          - not_null

      - name: task_template_id
        description: Identifier linking task to template/category

      # ─────────────────────────────────────────────
      # Business fields
      # ─────────────────────────────────────────────
      - name: actual_duration_minutes
        description: Actual time spent performing the task in minutes

      - name: performed_at
        description: Timestamp when the task was performed

      # ─────────────────────────────────────────────
      # Source metadata
      # ─────────────────────────────────────────────
      - name: source_system
        description: Source system from which the data originated

      - name: loaded_at
        description: Timestamp when record was loaded into bronze layer

      - name: source_file
        description: Source file used for ingestion tracking

      # ─────────────────────────────────────────────
      # Audit / processing
      # ─────────────────────────────────────────────
      - name: stg_loaded_at
        description: Timestamp when record was processed in staging layer