version: 2

models:
  - name: staging_provider_credential
    description: >
      Staging model for provider credential data. Standardizes raw source data
      into a consistent structure with minimal transformation. Serves as input
      to enterprise_silver_provider_credential.

    config:
      materialized: view
      schema: staging_provider_credential
      alias: provider_credential
      tags:
        - staging
        - provider
        - credential

    columns:

      - name: provider_id
        description: Raw provider identifier.

      - name: credential_id
        description: Raw credential identifier.

      - name: credential_type
        description: Type of provider credential.

      - name: credential_name
        description: Name of credential.

      - name: credential_status
        description: Raw credential status from source.

      - name: issue_date
        description: Credential issue date.

      - name: expiration_date
        description: Credential expiration date.

      - name: source_system
        description: Source system identifier.

      - name: _loaded_at
        description: Timestamp when record was ingested.

      - name: _source_file
        description: Source file name.