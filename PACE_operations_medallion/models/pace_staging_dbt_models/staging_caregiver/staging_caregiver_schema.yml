version: 2

models:

  - name: staging_caregiver
    description: >
      Thin staging layer for caregiver data sourced from
      BRONZE_CAREGIVER.RAW_CAREGIVER.
      Performs basic column selection and minimal filtering only.
      No business logic applied. Designed as a lightweight view.

    config:
      schema: staging_caregiver
      alias: caregiver
      materialized: view
      tags: ["staging", "caregiver"]

    columns:
      - name: caregiver_id
        description: Unique identifier for the caregiver.
        tests: [not_null]

      - name: center_id
        description: Associated PACE center identifier.

      - name: supervisor_id
        description: Supervisor or reporting caregiver ID.

      - name: first_name
        description: First name of the caregiver.

      - name: last_name
        description: Last name of the caregiver.

      - name: caregiver_type
        description: Type or classification of caregiver.

      - name: specialty
        description: Area of expertise or specialty.

      - name: license_number
        description: Professional license number.

      - name: license_state
        description: State where license is issued.

      - name: license_expiry_date
        description: Expiry date of caregiver license.

      - name: hire_date
        description: Date caregiver was hired.

      - name: termination_date
        description: Date caregiver employment ended (if applicable).

      - name: employment_status
        description: Current employment status.

      - name: max_participant_load
        description: Maximum number of participants assigned.

      - name: source_system
        description: Origin system of the record.

      - name: _loaded_at
        description: Raw ingestion timestamp from bronze layer.

      - name: _source_file
        description: Source file name.