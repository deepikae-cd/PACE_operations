version: 2

models:

  - name: staging_medication
    description: >
      Thin staging layer for medication records sourced from
      BRONZE_MEDICATION.RAW_MEDICATION.
      Performs basic column selection and minimal filtering only.
      No business logic applied. Designed as a lightweight view.

    config:
      schema: staging_medication
      alias: medication
      materialized: view
      tags: ["staging", "medication"]

    columns:
      - name: medication_id
        description: Unique identifier for medication record.
        tests: [not_null]

      - name: participant_id
        description: Identifier of the participant receiving medication.
        tests: [not_null]

      - name: provider_id
        description: Prescribing provider identifier.

      - name: visit_id
        description: Associated clinical visit identifier.

      - name: medication_name
        description: Name of the medication.

      - name: generic_name
        description: Generic drug name.

      - name: brand_name
        description: Brand name of medication.

      - name: ndc_code
        description: National Drug Code identifier.

      - name: drug_class
        description: Classification of the drug.

      - name: dosage
        description: Dosage amount.

      - name: dosage_unit
        description: Unit of dosage (mg, ml, etc.).

      - name: frequency
        description: Frequency of administration.

      - name: route_of_administration
        description: Route of administration (oral, IV, etc.).

      - name: prescribed_date
        description: Date medication was prescribed.

      - name: start_date
        description: Start date of medication.

      - name: end_date
        description: End date of medication.

      - name: medication_status
        description: Current status of medication.

      - name: refills_authorized
        description: Number of refills authorized.

      - name: refills_remaining
        description: Remaining refills.

      - name: last_refill_date
        description: Timestamp of last refill.

      - name: pharmacy_name
        description: Name of dispensing pharmacy.

      - name: pharmacy_id
        description: Pharmacy identifier.

      - name: pharmacy_npi
        description: Pharmacy NPI number.

      - name: pharmacy_phone
        description: Pharmacy contact number.

      - name: pharmacy_address
        description: Pharmacy address.

      - name: dispensed_quantity
        description: Quantity dispensed.

      - name: days_supply
        description: Number of days supply.

      - name: is_controlled_substance
        description: TRUE if medication is controlled substance.

      - name: dea_schedule
        description: DEA schedule classification.

      - name: prior_authorization_required
        description: Indicates if prior authorization is needed.

      - name: prior_authorization_status
        description: Status of prior authorization.

      - name: adverse_reactions
        description: Known adverse reactions.

      - name: contraindications
        description: Known contraindications.

      - name: interaction_alerts
        description: Drug interaction alerts.

      - name: administration_instructions
        description: Instructions for administering medication.

      - name: special_handling_notes
        description: Special handling requirements.

      - name: is_pace_formulary
        description: TRUE if medication is part of PACE formulary.

      - name: formulary_tier
        description: Formulary tier level.

      - name: cost_per_unit
        description: Cost per unit.

      - name: total_cost
        description: Total medication cost.

      - name: coverage_type
        description: Type of insurance coverage.

      - name: center_id
        description: PACE center identifier.

      - name: source_system
        description: Origin system.

      - name: _loaded_at
        description: Raw ingestion timestamp.

      - name: _source_file
        description: Source file name.
