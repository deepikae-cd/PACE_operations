version: 2

models:
  - name: staging_provider
    description: >
      Thin staging layer for provider data sourced from
      BRONZE_PROVIDER.RAW_PROVIDER.
      Performs basic column selection and minimal filtering only.
      No business logic applied. Designed as a lightweight view.

    config:
      schema: staging_provider
      alias: provider
      materialized: view
      tags:
        - staging
        - provider

    columns:

      # ───────────────────────────────
      # Keys
      # ───────────────────────────────
      - name: provider_id
        description: Unique identifier for provider.
        tests:
          - not_null

      - name: npi_number
        description: National Provider Identifier.

      - name: tax_id
        description: Tax identification number.

      - name: center_id
        description: Associated PACE center identifier.

      # ───────────────────────────────
      # Provider Details
      # ───────────────────────────────
      - name: provider_name
        description: Name of the provider.
        tests:
          - not_null

      - name: provider_type
        description: High-level provider classification.

      - name: provider_subtype
        description: More specific provider classification.

      - name: specialty
        description: Area of medical specialty.

      - name: network_status
        description: Network participation status.

      # ───────────────────────────────
      # Contract
      # ───────────────────────────────
      - name: contract_start_date
        description: Contract start date.

      - name: contract_end_date
        description: Contract end date.

      # ───────────────────────────────
      # Address & Contact
      # ───────────────────────────────
      - name: address_line1
        description: Address line 1.

      - name: city
        description: City.

      - name: state
        description: State.

      - name: zip_code
        description: Zip code.

      - name: phone_number
        description: Contact phone number.

      - name: fax_number
        description: Fax number.

      # ───────────────────────────────
      # Flags
      # ───────────────────────────────
      - name: accepts_telehealth
        description: Indicates if provider supports telehealth services.

      - name: accepts_pace_patients
        description: Indicates if provider accepts PACE participants.

      # ───────────────────────────────
      # Metadata
      # ───────────────────────────────
      - name: source_system
        description: Source system name.

      - name: _loaded_at
        description: Raw ingestion timestamp.

      - name: _source_file
        description: Source file identifier.
