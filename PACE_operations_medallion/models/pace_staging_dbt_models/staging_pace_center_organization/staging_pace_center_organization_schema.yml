version: 2

models:
  - name: staging_pace_center  
    description: "Staging model for PACE center data cleaned from RAW_PACE_CENTER"

    config:
      schema: staging_pace_center 
      alias: pace_center 
      materialized: view
      tags: ["staging", "pace_center"]

    columns:
      - name: pace_center_id
        description: "Unique identifier for the PACE center"
        tests:
          - not_null
          - unique

      - name: center_name
        description: "Name of the PACE center"
        tests:
          - not_null

      - name: region
        description: "Region where the PACE center is located"

      - name: loaded_at
        description: "Original load timestamp from source"
        tests:
          - not_null

      - name: stg_loaded_at
        description: "Timestamp when the record was processed in staging layer"
     