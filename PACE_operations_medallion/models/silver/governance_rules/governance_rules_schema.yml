version: 2

models:
  - name: governance_rules
    description: >
      Silver-layer governance rules dataset containing cleansed and standardized
      rule definitions used for system-wide compliance and operational controls.
      Deduplicated on rule_id with null validation applied to key fields.
      Business-derived flags and lifecycle statuses belong in the Gold layer.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: rule_id
        description: Unique identifier for each governance rule.
        tests:
          - not_null
          - unique

      - name: rule_name
        description: Uppercased and trimmed human-readable name of the governance rule.


      - name: rule_type
        description: Uppercased and trimmed category or type of the governance rule.
     

      - name: rule_description
        description: Trimmed free-text description of the governance rule from the source system.

      - name: effective_date
        description: Date from which the governance rule is considered in effect.
    
      - name: rule_status
        description: Uppercased and trimmed status of the governance rule from the source system.
    

      - name: source_created_ts
        description: Timestamp when the rule was originally created in the source system.

      - name: load_ts
        description: Timestamp when the record was loaded into the Silver layer.

      - name: source_system
        description: Name of the source system this record was ingested from.
     

      - name: record_hash
        description: >
          MD5 hash of key fields used for change detection and incremental
          load comparisons. Derived from rule_id, rule_name, rule_type,
          status, and effective_date.
      