version: 2

models:
  - name: participant
    description: >
      Silver-layer participant master dataset containing cleansed and
      standardized demographic attributes and participant status values.
      Deduplicated on participant_id with null validation applied to key
      fields. Business-derived flags belong in the Gold layer.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: participant_id
        description: Unique identifier for each participant.
        tests:
          - not_null
          - unique

      - name: first_name
        description: Uppercased and trimmed first name of the participant.
    
      - name: last_name
        description: Uppercased and trimmed last name of the participant.
       

      - name: gender
        description: Uppercased and trimmed gender of the participant.
       
      - name: email
        description: Lowercased and trimmed email address of the participant.

      - name: phone
        description: Digits-only phone number with all non-numeric characters stripped.

      - name: participant_status
        description: Uppercased and trimmed participant status. Defaults to ACTIVE when null in the source system.
   
      - name: source_created_ts
        description: Timestamp when the record was originally created in the source system.

      - name: load_ts
        description: Timestamp when the record was loaded into the Silver layer.

      - name: source_system
        description: Name of the source system this record was ingested from.
       

      - name: record_hash
        description: >
          MD5 hash of key fields used for change detection and incremental
          load comparisons. Derived from participant_id, first_name,
          last_name, gender, email, phone, and status.
    