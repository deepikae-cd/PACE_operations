version: 2

models:
  - name: participant
    description: Participant master dataset containing demographic and status details.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: participant_id
        tests:
          - not_null
          - unique

      - name: first_name
        tests:
          - not_null

      - name: last_name

      - name: gender

      - name: date_of_birth

      - name: participant_status
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'INACTIVE']

      - name: source_created_ts
      - name: load_ts
      - name: active_flag