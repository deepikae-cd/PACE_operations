version: 2

models:
  - name: clinical_visit
    description: >
      Silver layer table containing standardized clinical visit records.
      This model consolidates raw visit data, cleans identifiers,
      and prepares it for downstream analytics (Gold layer).

    columns:
      - name: visit_id
        description: Unique identifier for each clinical visit.
        tests:
          - not_null
          - unique

      - name: patient_id
        description: Unique identifier for the patient.
     

      - name: provider_id
        description: Identifier for the healthcare provider associated with the visit.
        tests:
          - not_null

      - name: visit_date
        description: Date when the clinical visit occurred.
        tests:
          - not_null

      - name: visit_type
        description: Type of visit (e.g., inpatient, outpatient, emergency).

      - name: diagnosis_code
        description: Primary diagnosis code recorded for the visit.

      - name: procedure_code
        description: Medical procedure code associated with the visit.

      - name: facility_id
        description: Identifier for the healthcare facility.

      - name: visit_status
        description: Current status of the visit (completed, cancelled, scheduled).

      - name: created_at
        description: Timestamp when the record was created in the system.

      - name: updated_at
        description: Timestamp when the record was last updated.

