version: 2

models:
  - name: appointment
    description: >
      Silver-layer appointment dataset containing cleansed and standardized
      appointment records. Includes deduplication, null validation, and audit
      metadata. Business-derived flags and categorizations are intentionally
      excluded and belong in the Gold layer.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: appointment_id
        description: Unique identifier for each appointment record.
        tests:
          - not_null
          - unique

      - name: participant_id
        description: Unique identifier of the participant associated with the appointment.
       

      - name: provider_id
        description: Unique identifier of the healthcare provider assigned to the appointment.
       
       

      - name: appointment_date
        description: Scheduled date of the appointment. Null records are excluded upstream.
      

      - name: service_type
        description: Uppercased and trimmed healthcare service type from the source system.

      - name: appointment_status
        description: Uppercased and trimmed appointment status from the source system.
        tests:
          - not_null
         

      - name: source_created_ts
        description: Timestamp when the appointment record was originally created in the source system.

      - name: load_ts
        description: Timestamp when the record was loaded into the Silver layer.

      - name: source_system
        description: Name of the source system this record was ingested from.
       

      - name: record_hash
        description: >
          MD5 hash of key fields used for change detection and incremental
          load comparisons. Derived from appointment_id, participant_id,
          provider_id, appointment_date, status, and service_type.
      