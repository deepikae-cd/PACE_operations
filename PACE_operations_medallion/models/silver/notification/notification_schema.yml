version: 2

models:
  - name: notification
    description: Notification dataset tracking message delivery to participants.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: notification_id
        tests:
          - not_null
          - unique

      - name: participant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('participant')
                field: participant_id

      - name: notification_type

      - name: notification_status
        tests:
          - accepted_values:
              arguments:
                values: ['SENT', 'FAILED', 'PENDING']

      - name: source_created_ts
      - name: load_ts
      - name: sent_flag
      - name: failed_flag