version: 2

models:
  - name: notification
    description: >
      Silver-layer notification dataset containing cleansed and standardized
      message delivery records across communication channels. Deduplicated on
      notification_id with null validation applied to key fields.
      Business-derived flags, channel categorizations, and outcome groupings
      belong in the Gold layer.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: notification_id
        description: Unique identifier for each notification record.
      

      - name: participant_id
        description: Unique identifier of the participant who received the notification.
   

      - name: notification_type
        description: Uppercased and trimmed notification type from the source system.


      - name: notification_channel
        description: Uppercased and trimmed communication channel from the source system.
    

      - name: notification_status
        description: Uppercased and trimmed delivery status from the source system.
     

      - name: source_created_ts
        description: Timestamp when the record was originally created in the source system.

      - name: load_ts
        description: Timestamp when the record was loaded into the Silver layer.

      - name: source_system
        description: Name of the source system this record was ingested from.
    

      - name: record_hash
        description: >
          MD5 hash of key fields used for change detection and incremental
          load comparisons. Derived from notification_id, participant_id,
          notification_type, channel, and status.
     