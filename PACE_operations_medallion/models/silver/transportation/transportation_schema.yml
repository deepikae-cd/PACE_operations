version: 2

models:
  - name: transportation
    description: >
      Silver-layer transportation dataset containing cleansed and standardized
      trip-level records. Deduplicated on transportation_id with null validation
      applied to key fields. Business-derived flags belong in the Gold layer.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: transportation_id
        description: Unique identifier for each transportation record.
        tests:
          - not_null
          - unique

      - name: participant_id
        description: Unique identifier of the participant associated with the trip.
   

      - name: pickup_location
        description: Uppercased and trimmed pickup location from the source system.
    

      - name: destination
        description: Uppercased and trimmed destination from the source system.
     

      - name: pickup_time
        description: Scheduled or actual pickup timestamp. Null records are excluded upstream.
  

      - name: trip_status
        description: Uppercased and trimmed trip status. Defaults to UNKNOWN when null in the source system.
      

      - name: source_created_ts
        description: Timestamp when the record was originally created in the source system.

      - name: load_ts
        description: Timestamp when the record was loaded into the Silver layer.

      - name: source_system
        description: Name of the source system this record was ingested from.
      

      - name: record_hash
        description: >
          MD5 hash of key fields used for change detection and incremental
          load comparisons. Derived from transport_id, participant_id,
          pickup_location, destination, pickup_time, and status.
     