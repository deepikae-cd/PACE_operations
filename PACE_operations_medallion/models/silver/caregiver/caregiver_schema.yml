version: 2

models:
  - name: caregiver
    description: Caregiver master dataset with identity and role attributes.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: caregiver_id
        tests:
          - not_null
          - unique

      - name: first_name
        tests:
          - not_null

      - name: last_name

      - name: caregiver_role

      - name: source_created_ts
      - name: load_ts