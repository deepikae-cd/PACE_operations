version: 2

models:
  - name: meal_delivery
    description: >
      Silver-layer meal delivery dataset containing cleansed and standardized
      meal delivery records for participant meal services. Deduplicated on
      meal_delivery_id with null validation applied to key fields.
      Business-derived flags, timeliness metrics, and delivery categorizations
      belong in the Gold layer.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: meal_delivery_id
        description: Unique identifier for each meal delivery record.
        tests:
          - not_null
          - unique

      - name: participant_id
        description: Unique identifier of the participant receiving the meal.
   

      - name: delivery_date
        description: Date on which the meal was scheduled or delivered. Null records are excluded upstream.
      

      - name: meal_type
        description: Uppercased and trimmed meal type from the source system.
     

      - name: meal_status
        description: Uppercased and trimmed delivery status from the source system.
       

      - name: source_created_ts
        description: Timestamp when the record was originally created in the source system.

      - name: load_ts
        description: Timestamp when the record was loaded into the Silver layer.

      - name: source_system
        description: Name of the source system this record was ingested from.
        
      - name: record_hash
        description: >
          MD5 hash of key fields used for change detection and incremental
          load comparisons. Derived from meal_id, participant_id,
          delivery_date, meal_type, and status.
      