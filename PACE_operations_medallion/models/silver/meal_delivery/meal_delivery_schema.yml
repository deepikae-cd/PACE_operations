version: 2

models:
  - name: meal_delivery
    description: >
      Silver-layer meal delivery dataset containing standardized meal delivery
      records, delivery status indicators, timeliness metrics, and business
      categorization for participant meal services.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: meal_delivery_id
        tests:
          - not_null
          - unique

      - name: participant_id
        tests:
          - not_null
          - relationships:
              to: ref('participant')
              field: participant_id

      - name: delivery_date
        tests:
          - not_null

      - name: meal_type

      - name: meal_status
        tests:
          - accepted_values:
              values:
                - DELIVERED
                - PENDING
                - CANCELLED

      - name: source_created_ts
      - name: load_ts

      - name: days_since_delivery

      - name: delivered_flag
      - name: pending_flag
      - name: cancelled_flag

      - name: delivery_category
        tests:
          - accepted_values:
              values:
                - MISSED
                - TODAY
                - UPCOMING
                - COMPLETED