version: 2

models:
  - name: participant_meal_summary
    description: >
      Gold-layer meal delivery summary aggregated by participant. Provides
      per-participant delivery counts, missed delivery tracking, and success
      rate metrics for nutritional service reporting. Business logic is
      derived directly from Silver-layer status and date values.

    config:
      schema: GOLD
      materialized: table

    columns:
      - name: participant_id
        description: Unique identifier of the participant.
        tests:
          - not_null
          - unique

      - name: total_meals_scheduled
        description: Total number of meal deliveries scheduled for the participant.
    

      - name: meals_delivered
        description: Number of meal deliveries with a status of DELIVERED.
    

      - name: meals_pending
        description: Number of meal deliveries with a status of PENDING.
     

      - name: meals_cancelled
        description: Number of meal deliveries with a status of CANCELLED.


      - name: missed_deliveries
        description: >
          Number of meal deliveries where the delivery date is in the past
          and the status is not DELIVERED.
   

      - name: not_delivered
        description: Total number of meal deliveries where the status is not DELIVERED.
    

      - name: delivery_success_rate_pct
        description: >
          Percentage of meals successfully delivered out of total meals
          scheduled, rounded to two decimal places.
      
      - name: non_delivery_rate_pct
        description: >
          Percentage of meals not delivered out of total meals scheduled,
          rounded to two decimal places.
      

      - name: load_ts
        description: Timestamp when the record was loaded into the Gold layer.
