version: 2

models:
  - name: participant_operations_summary
    description: >
      Gold layer participant operations KPI mart providing a consolidated
      view of participant engagement, appointments, clinical visits,
      transportation, meal delivery, and notifications.

    config:
      schema: GOLD
      materialized: table

    columns:

      - name: participant_id
        description: Unique participant identifier.
        tests:
          - not_null
          - unique

      - name: first_name
        description: Participant first name.

      - name: last_name
        description: Participant last name.

      - name: participant_status
        description: Current participant status.

      - name: total_appointments
        description: Total appointments associated with the participant.

      - name: completed_appointments
        description: Total completed appointments.

      - name: cancelled_appointments
        description: Total cancelled appointments.

      - name: total_clinical_visits
        description: Total clinical visits completed by the participant.

      - name: total_transports
        description: Total transportation requests.

      - name: completed_transports
        description: Total completed transportation services.

      - name: total_meals
        description: Total meal deliveries scheduled.

      - name: delivered_meals
        description: Total meal deliveries successfully delivered.

      - name: total_notifications
        description: Total notifications sent to the participant.

      - name: successful_notifications
        description: Total successfully delivered notifications.

      - name: load_ts
        description: Timestamp when KPI record was generated.