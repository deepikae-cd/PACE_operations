version: 2

models:
  - name: participant_transportation_summary
    description: >
      Gold-layer transportation summary aggregated by participant. Provides
      per-participant trip counts, completion and cancellation rates, and
      first and last trip dates for care coordination and mobility service
      reporting. Business logic is derived directly from Silver-layer
      trip_status values.

    config:
      schema: GOLD
      materialized: table

    columns:
      - name: participant_id
        description: Unique identifier of the participant.
        tests:
          - not_null
          - unique

      - name: total_trips
        description: Total number of transportation trips associated with the participant.
    

      - name: completed_trips
        description: Number of trips with a status of COMPLETED.
    

      - name: cancelled_trips
        description: Number of trips with a status of CANCELLED.
      
      - name: completion_rate
        description: >
          Percentage of trips completed out of total trips, rounded to
          two decimal places.
    

      - name: cancellation_rate
        description: >
          Percentage of trips cancelled out of total trips, rounded to
          two decimal places.
       

      - name: first_trip_date
        description: Timestamp of the earliest transportation record for the participant.

      - name: last_trip_date
        description: Timestamp of the most recent transportation record for the participant.

      - name: load_ts
        description: Timestamp when the record was loaded into the Gold layer.
  