version: 2

models:
  - name: appointment_summary
    description: >
      Gold-layer daily appointment summary aggregated by appointment date.
      Provides completion and cancellation rates alongside overdue counts
      for operational reporting and service analytics. Business logic is
      derived directly from Silver-layer status values.

    config:
      schema: GOLD
      materialized: table

    columns:
      - name: appointment_date
        description: The appointment date for which metrics are aggregated.
        tests:
          - not_null
          - unique

      - name: total_appointments
        description: Total number of appointments scheduled on the given date.
      

      - name: completed_count
        description: Number of appointments with a status of COMPLETED on the given date.
     
      - name: cancelled_count
        description: Number of appointments with a status of CANCELLED on the given date.
      

      - name: completion_rate
        description: Percentage of appointments completed out of total appointments on the given date.
     

      - name: cancellation_rate
        description: Percentage of appointments cancelled out of total appointments on the given date.
      

      - name: overdue_count
        description: >
          Number of appointments where the appointment date is in the past
          and the status is neither COMPLETED nor CANCELLED.
      
      - name: load_ts
        description: Timestamp when the record was loaded into the Gold layer.
      