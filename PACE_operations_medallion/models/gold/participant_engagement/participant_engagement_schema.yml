version: 2

models:
  - name: participant_engagement_summary
    description: >
      Gold-layer participant engagement summary aggregating service utilization
      across appointments, meal deliveries, and transportation trips per
      participant. Provides a composite engagement level classification for
      care coordination and outreach reporting.

    config:
      schema: GOLD
      materialized: table

    columns:
      - name: participant_id
        description: Unique identifier of the participant.
        tests:
          - not_null
          - unique

      - name: total_appointments