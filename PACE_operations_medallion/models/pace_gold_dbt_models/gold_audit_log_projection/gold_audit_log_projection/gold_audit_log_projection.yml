version: 2

models:
  - name: gold_audit_log_projection

    description: >
      Read-optimized audit log projection designed for fast UI access.
      Denormalizes audit events and precomputes human-readable descriptions
      to eliminate runtime joins. Optimized for participant-level and
      date-range queries using partitioning and clustering.

    config:
      schema: gold_audit_log
      alias: audit_log_projection
      materialized: incremental
      unique_key: audit_log_id
      tags: ['gold', 'audit', 'performance']


    columns:

      - name: audit_projection_sk
        description: Surrogate key for audit projection.
        tests:
          - not_null
          - unique

      - name: audit_log_id
        description: Unique audit event ID.
        tests:
          - not_null

      - name: participant_id
        description: Participant related to audit event.

      - name: actor_id
        description: User or system that performed the action.

      - name: event_description_ui
        description: Precomputed human-readable event description.

      - name: event_timestamp
        description: Timestamp of event occurrence.

      - name: event_date
        description: Date of event (used for partitioning).

      - name: event_hour
        description: Hour of event for time-based analysis.

      - name: is_phi_access
        description: Indicates PHI access event.

      - name: is_sensitive
        description: Flags sensitive actions.

      - name: module
        description: Application module generating the event.

      - name: source_system
        description: Origin system of audit record.
