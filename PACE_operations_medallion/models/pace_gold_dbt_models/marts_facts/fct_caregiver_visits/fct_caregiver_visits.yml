version: 2

models:
  - name: fct_caregiver_visits

    description: >
      Fact table capturing caregiver visits for participants.
      Each row represents a single visit event with duration and type.

    config:
      materialized: incremental
      schema: marts_facts
      alias: caregiver_visits


    columns:

      - name: visit_id
        description: Unique visit identifier
        tests:
          - not_null
          - unique

      - name: caregiver_id
        description: Caregiver assigned to visit
        tests:
          - not_null

      - name: participant_id
        description: Participant receiving visit
        tests:
          - not_null

      - name: visit_date
        description: Date of visit

      - name: visit_type
        description: Type of visit (home, virtual, etc.)

      - name: duration_minutes
        description: Duration of visit in minutes