version: 2

models:
  - name: gold_provider_credential
    description: >
      Gold-layer provider credential model that tracks licensing and
      credential lifecycle, expiry status, and compliance risk.
      Supports provider compliance monitoring and UC-14 (Provider lifecycle).

    config:
      materialized: table
      schema: gold_provider_credential
      alias: provider_credential
      tags:
        - gold
        - provider
        - credential

    columns:

      - name: provider_credential_sk
        description: Surrogate key uniquely identifying provider credential record.
   
      - name: provider_id
        description: Unique provider identifier.
        tests:
          - not_null

      - name: credential_type
        description: Type of credential (e.g., MD, RN, License).
        tests:
          - not_null

      - name: credential_name
        description: Human-readable credential name.

      - name: credential_status
        description: Status of credential (ACTIVE, INACTIVE, etc.).

      - name: issue_date
        description: Date the credential was issued.

      - name: expiration_date
        description: Credential expiration date.

      - name: days_until_expiry
        description: Number of days remaining until expiration.

      - name: is_expired_flag
        description: Indicates whether credential has expired.

      - name: is_expiring_soon_flag
        description: Indicates whether credential will expire within 30 days.

      - name: is_currently_active_flag
        description: Indicates valid and active credential.

      - name: credential_compliance_status
        description: Derived compliance status (ACTIVE, EXPIRING_SOON, EXPIRED).

      - name: credential_risk_level
        description: Risk classification based on expiry status (LOW, MEDIUM, HIGH).

      - name: is_credential_at_risk_flag
        description: Flag indicating provider credential risk.

      - name: is_fully_compliant_flag
        description: Indicates fully valid and non-risk credentials.
