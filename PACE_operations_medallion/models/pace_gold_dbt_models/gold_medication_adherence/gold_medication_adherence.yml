version: 2

models:
  - name: gold_medication_adherence
    description: >
      Participant-level aggregated medication metrics used for operational
      and analytical decision-making. Provides medication counts, refill risks,
      adherence proxies, and recommended dispenser size for UC-2.

    config:
      materialized: table
      schema: gold_medication_adherence
      alias: medication_adherence
      tags:
        - gold
        - medication
        - analytics

    columns:

      - name: participant_id
        description: Unique participant identifier.
        tests:
          - not_null
          - unique

      - name: total_active_medications
        description: Count of currently active medications.

      - name: recommended_dispenser_size
        description: Suggested medication dispenser size (SMALL, MEDIUM, LARGE).

      - name: medication_risk_level
        description: Risk level based on medication profile.

      - name: medications_needing_refill_count
        description: Count of medications needing refill attention.

      - name: prior_auth_risk_count
        description: Number of medications with prior authorization issues.

      - name: interaction_alert_count
        description: Count of medications flagged with interaction alerts.

      - name: total_medication_cost
        description: Total cost of all medications for the participant.

      - name: avg_medication_cost
        description: Average cost per medication.
