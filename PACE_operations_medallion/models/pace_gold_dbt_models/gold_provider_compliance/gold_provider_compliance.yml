version: 2

models:

  - name: gold_provider_compliance
    description: >
      Tracks provider contract lifecycle and compliance status.

      Helps identify:
      - Expiring contracts
      - Inactive providers
      - Network coverage risks

      Core dataset for provider governance and regulatory reporting.

    config:
      materialized: table
      schema: gold_provider_compliance
      alias: provider_compliance
      tags: ['gold', 'provider', 'compliance']



    columns:

      - name: provider_sk
        description: Surrogate key for provider.
        tests:
          - not_null
          - unique

      - name: provider_id
        description: Unique provider identifier.
        tests:
          - not_null

      - name: provider_name
        description: Provider full name.

      - name: center_id
        description: Associated PACE center.

      - name: contract_start_date
        description: Contract start date.

      - name: contract_end_date
        description: Contract end date.

      - name: is_contract_active_flag
        description: Indicates if contract is currently active.

      - name: is_contract_expiring_soon_flag
        description: Indicates contracts approaching expiry threshold.

      - name: days_until_contract_expiry
        description: Number of days remaining until contract expiration.

      - name: compliance_status
        description: Business-defined compliance state (ACTIVE, EXPIRING_SOON, INACTIVE).

      - name: compliance_risk_level
        description: Risk classification (LOW, MEDIUM, HIGH).

      - name: is_compliance_at_risk_flag
        description: Flag for providers at compliance risk.

      - name: is_fully_compliant_flag
        description: Indicates fully compliant providers.

      - name: source_system
        description: Source system of record.

      - name: loaded_timestamp
        description: Ingestion timestamp from source system.