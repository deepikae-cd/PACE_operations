version: 2

models:
  - name: fct_meal_delivery

    description: >
      Fact table capturing participant meal delivery events.
      Each row represents the latest state of a delivery,
      deduplicated at the delivery_id level.

    config:
      materialized: incremental
      schema: gold_marts_facts
      alias: meal_delivery
      unique_key: delivery_id   
      on_schema_change: sync_all_columns

    columns:

      - name: delivery_id
        description: Unique identifier for each meal delivery (final grain).
        tests:
          - not_null
          - unique

      - name: participant_id
        description: Identifier of the participant receiving the meal.
   

      - name: delivery_date
        description: Scheduled or actual delivery date and time.

      - name: delivery_status
        description: Standardized status of the delivery (e.g., DELIVERED, FAILED, CANCELLED).

      - name: delivered_flag
        description: Binary flag indicating whether the meal was successfully delivered (1 = delivered, 0 = not delivered).