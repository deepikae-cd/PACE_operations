version: 2

models:

  - name: fct_idt_clinical_visit
    description: >
      Core fact table capturing clinical visits performed by providers
      and interdisciplinary care teams (IDT).

      Each record represents a clinical interaction with a participant,
      including diagnosis, procedures, vitals, and follow-up indicators.

      This model supports:
      - Clinical outcome monitoring
      - Care delivery analysis
      - Patient risk identification
      - Quality reporting and compliance

    config:
      materialized: table
      schema: gold_marts_facts
      alias: fct_idt_clinical_visit
      unique_key: visit_id
      tags: ['fact', 'clinical', 'idt', 'visits']

    columns:

      - name: visit_id
        description: "Unique identifier for the clinical visit."
        tests:
          - not_null
          - unique

      - name: visit_sk
        description: "Surrogate key for visit."

      - name: participant_id
        description: "Participant receiving care."

      - name: provider_id
        description: "Provider responsible for clinical oversight."

      - name: caregiver_id
        description: "Caregiver involved in visit execution."

      - name: center_id
        description: "PACE center where visit is associated."

      - name: visit_date
        description: "Date of clinical visit."

      - name: visit_type
        description: "Type of visit (e.g., ROUTINE, EMERGENCY, FOLLOW-UP)."

      - name: location_type
        description: "Location type (e.g., HOME, CENTER, TELEHEALTH)."

      - name: visit_duration_minutes
        description: "Duration of visit in minutes."

      - name: primary_diagnosis_code
        description: "Primary clinical diagnosis code for the visit."

      - name: primary_diagnosis_chapter
        description: "Diagnosis grouped into clinical chapter/category."

      - name: secondary_diagnosis_count
        description: "Number of secondary diagnoses recorded."

      - name: procedure_count
        description: "Number of procedures performed during visit."

      - name: is_high_acuity_location_flag
        description: "Indicates high-acuity care setting."

      - name: is_long_visit_flag
        description: "Indicates unusually long visit duration."

      - name: has_procedures_flag
        description: "Indicates procedures were performed."

      - name: is_vitals_complete_flag
        description: "Indicates all required vitals were captured."

      - name: is_heart_rate_abnormal_flag
        description: "Flag for abnormal heart rate readings."

      - name: is_temperature_abnormal_flag
        description: "Flag for abnormal temperature readings."

      - name: is_o2_low_flag
        description: "Flag for low oxygen saturation."

      - name: follow_up_required
        description: "Indicates follow-up is required."

      - name: follow_up_due_date
        description: "Scheduled due date for follow-up."

      - name: is_follow_up_overdue_flag
        description: "Indicates follow-up has not been completed within expected time."

      - name: dbt_updated_timestamp
        description: "Timestamp when record was last processed."