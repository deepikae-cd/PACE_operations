version: 2

models:
  - name: fct_transportation

    description: >
      Fact table capturing transportation (ride) events for participants.
      Each row represents the latest state of a transportation trip,
      deduplicated at the transportation_id level.

    config:
      materialized: incremental
      schema: gold_marts_facts
      alias: fct_transportation
      unique_key: transportation_id  
      incremental_strategy: merge

    columns:

      - name: transportation_id
        description: Unique identifier for each transportation ride.


      - name: participant_id
        description: Identifier of the participant associated with the trip.

      - name: ride_date
        description: Scheduled date and time of the transportation ride.

      - name: pickup_location
        description: Normalized pickup location for the trip.

      - name: dropoff_location
        description: Normalized drop-off location for the trip.

      - name: trip_status
        description: Standardized lifecycle status of the transportation trip (e.g., SCHEDULED, COMPLETED, CANCELLED).

      - name: completed_flag
        description: Binary flag indicating whether the trip was completed (1 = completed, 0 = not completed).