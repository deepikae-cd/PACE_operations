version: 2

sources:

  - name: bronze_participant
    description: "Raw Participant domain"
    schema: BRONZE_PARTICIPANT
    tables:
      - name: RAW_PARTICIPANT
        description: "Core participant records"


  - name: bronze_appointment
    description: "Raw Appointment domain"
    schema: BRONZE_APPOINTMENT
    tables:
      - name: RAW_APPOINTMENT
        description: "Scheduled care event records"



  - name: bronze_caregiver
    description: "Raw Caregiver domain"
    schema: BRONZE_CAREGIVER
    tables:
      - name: RAW_CAREGIVER
        description: "Core caregiver (care staff) records"

      - name: RAW_CAREGIVER_ASSIGNMENT
        description: "Caregiver to participant assignment and relationship records"


  - name: bronze_clinical_visit
    description: "Raw Clinical Visit domain"
    schema: BRONZE_CLINICAL_VISIT
    tables:
      - name: RAW_CLINICAL_VISIT
        description: "Medical and clinical encounter records"


  - name: bronze_meal_delivery
    description: "Raw Meal Delivery domain"
    schema: BRONZE_MEAL_DELIVERY
    tables:
      - name: RAW_MEAL_DELIVERY
        description: "Meal delivery and nutrition service records"


  - name: bronze_transportation
    description: "Raw Transportation domain"
    schema: BRONZE_TRANSPORTATION
    tables:
      - name: RAW_TRANSPORTATION
        description: "Transportation and trip service records"


  - name: bronze_governance
    description: "Raw Governance and compliance domain"
    schema: BRONZE_GOVERNANCE
    tables:
      - name: RAW_GOVERNANCE_RULES
        description: "Governance rules, compliance logic, and regulatory metadata"

      - name: RAW_COMPLIANCE_VIOLATIONS
        description: "Compliance violations and rule breach events"


  - name: bronze_notification
    description: "Raw Notification domain"
    schema: BRONZE_NOTIFICATION
    tables:
      - name: RAW_NOTIFICATION
        description: "Notification delivery, messaging, and communication records"


  - name: bronze_provider
    description: "Raw Provider domain"
    schema: BRONZE_PROVIDER
    tables:
      - name: RAW_PROVIDER
        description: "Provider, vendor, and external healthcare entity records"


  - name: bronze_medication
    description: "Raw Medication domain"
    schema: BRONZE_MEDICATION
    tables:
      - name: RAW_MEDICATION
        description: "Medication prescriptions, dosage, and pharmacy linkage records"

  - name: bronze_organization
    description: "Raw Organization, Center, and Service Area domain"
    schema: BRONZE_ORGANIZATION
    tables:
      - name: RAW_ORGANIZATION_SERVICE_AREA
        description: "Organization hierarchy, service centers, and geographic service area coverage data"

  - name: bronze_audit
    description: "Raw Audit Log domain capturing all system actions and events"
    schema: BRONZE_AUDIT
    tables:
      - name: RAW_AUDIT_LOG
        description: "Audit trail of all user and system actions across PACE systems including PHI access, changes, and compliance-sensitive events"
  
  - name: bronze_care_plan
    description: "Raw Care Plan domain"
    schema: BRONZE_CARE_PLAN
    tables:
      - name: RAW_CARE_PLAN_ACTIVITY
        description: "Core care plan activity records capturing planned services for participants across program years"

  - name: bronze_task
    description: "Raw Task domain capturing task execution and task definitions"
    schema: BRONZE_TASK
    tables:
      - name: RAW_TASK_INSTANCE
        description: "Task execution records capturing actual work performed by aides including duration and timestamps"

      - name: RAW_TASK_TEMPLATE
        description: "Task template definitions capturing standard task configurations and reusable task structures"
