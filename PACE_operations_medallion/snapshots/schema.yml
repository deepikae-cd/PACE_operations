version: 2

snapshots:
  - name: participant_snapshot

    description: >
      SCD Type 2 snapshot tracking historical participant changes.

    columns:

      - name: participant_id
        description: Unique participant identifier.
        tests:
          - not_null

      - name: first_name
        description: Participant first name.

      - name: last_name
        description: Participant last name.

      - name: participant_status
        description: Participant status tracked over time.

      - name: dbt_valid_from
        description: Snapshot effective start timestamp.
        tests:
          - not_null

      - name: dbt_valid_to
        description: Snapshot effective end timestamp.

      - name: dbt_updated_at
        description: Timestamp used by dbt snapshot logic.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - participant_id
            - dbt_valid_to