name: PACE_operations_medallion
version: '1.0.0'
config-version: 2

profile: PACE_operations

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
docs-paths: ["docs"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# ============================================================
# VARIABLES (WORKS FOR DOCKER + DBT CLOUD)
# ============================================================

vars:
  silver_schema_prefix: "{{ env_var('SILVER_SCHEMA_PREFIX', 'PACE') }}"
  materialization_default: "{{ env_var('DBT_MATERIALIZATION', 'table') }}"

# ============================================================
# GLOBAL DEFAULTS
# ============================================================

models:
  PACE_operations_medallion:

    +persist_docs:
      relation: true
      columns: true


    # ===============================
    # SILVER LAYER
    # ===============================
    pace_enterprise_silver_dbt_models:

      +tags: ["silver"]

      enterprise_silver_participant:
        +schema: "{{ var('silver_schema_prefix') }}_ENTERPRISE_PARTICIPANT"

      enterprise_silver_provider:
        +schema: "{{ var('silver_schema_prefix') }}_SILVER_PROVIDER"

      enterprise_silver_appointment:
        +schema: "{{ var('silver_schema_prefix') }}_SILVER_APPOINTMENT"

      enterprise_silver_caregiver:
        +schema: "{{ var('silver_schema_prefix') }}_SILVER_CAREGIVER"

      enterprise_silver_idt_clinical:
        +schema: "{{ var('silver_schema_prefix') }}_SILVER_IDT_CLINICAL"

      enterprise_silver_meal_delivery:
        +schema: "{{ var('silver_schema_prefix') }}_SILVER_MEAL_DELIVERY"

      enterprise_silver_transportation:
        +schema: "{{ var('silver_schema_prefix') }}_SILVER_TRANSPORTATION"


    # ===============================
    # GOLD LAYER (future scalable)
    # ===============================
    pace_gold_dbt_models:

      +tags: ["gold"]
      +materialized: table
      +schema: "{{ target.schema }}_GOLD"
