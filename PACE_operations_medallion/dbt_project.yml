name: PACE_operations_medallion
version: '1.0.0'
config-version: 2

profile: DBT_PROD

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
docs-paths: ["docs"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# ============================================================
# GLOBAL DEFAULTS
# ============================================================

models:
  PACE_operations_medallion:
    +persist_docs:
      relation: true
      columns: true

    # ================= SILVER LAYER =================

    silver:

      +materialized: table

      participant:
        +schema: SILVER_PARTICIPANT

      provider:
        +schema: SILVER_PROVIDER

      appointment:
        +schema: SILVER_APPOINTMENT

      caregiver:
        +schema: SILVER_CAREGIVER

      clinical_visit:
        +schema: SILVER_CLINICAL_VISIT

      combined:
        +schema: SILVER_COMBINED

      governance:
        +schema: SILVER_GOVERNANCE

      meal_delivery:
        +schema: SILVER_MEAL_DELIVERY

      notification:
        +schema: SILVER_NOTIFICATION

      transportation:
        +schema: SILVER_TRANSPORTATION


# ============================================================
# SNAPSHOTS
# ============================================================

snapshots:
  pace_dw:
    +target_database: "{{ target.database }}"
    +persist_docs:
      relation: true