name: PACE_operations_medallion
version: '1.0.0'
config-version: 2

profile: PACE_operations

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
docs-paths: ["docs"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# ============================================================
# GLOBAL DEFAULTS
# ============================================================

models:
  PACE_operations_medallion:

    +persist_docs:
      relation: true
      columns: true

    # ===============================
    # SILVER LAYER
    # ===============================

    pace_enterprise_silver_dbt_models:

      +tags: ["silver"]
      +schema: ENTERPRISE_SILVER
      +materialized: view
    
    # ===============================
    # GOLD LAYER
    # ===============================
    pace_gold_dbt_models:

      +tags: ["gold"]
      +materialized: table
      schema: GOLD
     