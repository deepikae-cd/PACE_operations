name: PACE_operations_medallion
version: '1.0.0'
config-version: 2

profile: PACE_operations

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
docs-paths: ["docs"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# ============================================================
# BEHAVIOR FLAGS (to suppress dbt Cloud popup)
# ============================================================
flags:
  skip_nodes_if_on_run_start_fails: false
  state_modified_compare_more_unrendered_values: false
  require_yaml_configuration_for_mf_time_spines: false
  require_batched_execution_for_custom_microbatch_strategy: false
  require_nested_cumulative_type_params: false
  validate_macro_args: false
  require_all_warnings_handled_by_warn_error: false

# ============================================================
# GLOBAL DEFAULTS
# ============================================================
models:
  PACE_operations_medallion:

    +persist_docs:
      relation: true
      columns: true

    # ===============================
    # SILVER LAYER
    # ===============================
    pace_enterprise_silver_dbt_models:

      +tags: ["silver"]
      +schema: ENTERPRISE_SILVER
      +materialized: view

    # ===============================
    # GOLD LAYER
    # ===============================
    pace_gold_dbt_models:

      +tags: ["gold"]
      +materialized: table
      +schema: GOLD