name: dbt Cloud CI/CD Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

  workflow_dispatch:  # manual prod trigger
  

env:
  DBT_CLOUD_HOST: https://br531.us1.dbt.com


jobs:

  # ─────────────────────────────
  # CI JOB (PR)
  # ─────────────────────────────
  dbt-ci:
    name: dbt Cloud CI (PR Slim CI)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Trigger dbt Cloud CI Job
        run: |
          echo "Triggering dbt CI job..."
          run_response=$(curl --silent --fail -X POST "$DBT_CLOUD_HOST/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PR_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"cause": "Triggered from PR"}')

          run_id=$(echo $run_response | jq -r '.data.id')

          echo "Run ID: $run_id"


  # ─────────────────────────────
  # STAGING DEPLOY
  # ─────────────────────────────
  dbt-staging:
    name: dbt Cloud Deployment — Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger dbt Staging Job
        run: |
          echo "Triggering dbt staging job..."
          curl --fail -X POST "$DBT_CLOUD_HOST/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_STAGING_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"cause": "Deploy to staging from main"}'


  # ─────────────────────────────
  # PROD DEPLOY (MANUAL)
  # ─────────────────────────────
  dbt-prod:
    name: dbt Cloud Deployment — Production
    runs-on: ubuntu-latest
    needs: dbt-staging
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger dbt Production Job
        run: |
          echo "Triggering dbt production job..."
          curl --fail -X POST "$DBT_CLOUD_HOST/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PROD_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"cause": "Manual production deployment"}'
