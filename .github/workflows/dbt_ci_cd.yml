name: dbt Cloud CI/CD Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

env:
  DBT_CLOUD_HOST: https://br531.us1.dbt.com

jobs:
  # CI Job
  dbt-ci:
    name: dbt Cloud CI (Slim CI on PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

  # Silver Prod
  dbt-prod-silver:
    name: dbt Cloud Production — Silver Pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  # Gold Prod
  dbt-prod-gold:
    name: dbt Cloud Production — Gold Pipeline
    runs-on: ubuntu-latest
    needs: dbt-prod-silver
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
