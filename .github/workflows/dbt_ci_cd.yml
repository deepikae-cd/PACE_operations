name: dbt CI/CD Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'dbt_project.yml'
      - 'packages.yml'
  push:
    branches: [main]

env:
  DBT_CLOUD_HOST: https://cloud.getdbt.com

jobs:

  # ───────────────────────────────────────────
  # JOB 1: Slim CI on Pull Requests
  # ───────────────────────────────────────────
  dbt-ci:
    name: dbt Cloud CI (Slim CI on PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger dbt Cloud CI Job
        id: trigger_ci
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PR_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cause": "GitHub Actions PR #${{ github.event.pull_request.number }}",
              "schema_override": "PR_${{ github.event.pull_request.number }}",
              "git_sha": "${{ github.event.pull_request.head.sha }}",
              "github_pull_request_id": ${{ github.event.pull_request.number }}
            }')

          echo "Response: $RESPONSE"
          RUN_ID=$(echo $RESPONSE | jq -r '.data.id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered CI run: $RUN_ID"

      - name: Wait for dbt Cloud CI Job to complete
        id: wait_for_ci
        run: |
          RUN_ID=${{ steps.trigger_ci.outputs.run_id }}
          echo "Polling CI run $RUN_ID..."

          for i in $(seq 1 60); do
            sleep 30
            STATUS_RESPONSE=$(curl -s \
              "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              -H "Authorization: Token ${{ secrets.DBT_API_KEY }}")

            STATUS=$(echo $STATUS_RESPONSE | jq -r '.data.status')
            STATUS_MESSAGE=$(echo $STATUS_RESPONSE | jq -r '.data.status_message')
            RUN_URL=$(echo $STATUS_RESPONSE | jq -r '.data.href')

            echo "Attempt $i — Status: $STATUS ($STATUS_MESSAGE)"

            # dbt Cloud status codes: 1=Queued, 2=Starting, 3=Running, 10=Success, 20=Error, 30=Cancelled
            if [ "$STATUS" = "10" ]; then
              echo "dbt Cloud CI job succeeded"
              exit 0
            elif [ "$STATUS" = "20" ] || [ "$STATUS" = "30" ]; then
              echo "dbt Cloud CI job failed. See: $RUN_URL"
              exit 1
            fi
          done

          echo "Timed out waiting for CI job"
          exit 1

  # ───────────────────────────────────────────
  # JOB 2: Deploy Silver Layer on merge to main
  # ───────────────────────────────────────────
  dbt-prod-silver:
    name: dbt Cloud Production Deploy — Silver
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger dbt Cloud Silver Job
        id: trigger_silver
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PROD_SILVER_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cause": "Silver deploy — merge to main by ${{ github.actor }} — commit ${{ github.sha }}",
              "git_sha": "${{ github.sha }}"
            }')

          echo "Response: $RESPONSE"
          RUN_ID=$(echo $RESPONSE | jq -r '.data.id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered Silver run: $RUN_ID"

      - name: Wait for Silver Job to complete
        id: wait_for_silver
        run: |
          RUN_ID=${{ steps.trigger_silver.outputs.run_id }}
          RUN_URL="${{ env.DBT_CLOUD_HOST }}/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID"
          echo "Polling Silver run: $RUN_URL"

          for i in $(seq 1 80); do
            sleep 30
            STATUS_RESPONSE=$(curl -s \
              "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              -H "Authorization: Token ${{ secrets.DBT_API_KEY }}")

            STATUS=$(echo $STATUS_RESPONSE | jq -r '.data.status')
            echo "Attempt $i — Status code: $STATUS"

            if [ "$STATUS" = "10" ]; then
              echo "Silver deploy succeeded: $RUN_URL"
              exit 0
            elif [ "$STATUS" = "20" ] || [ "$STATUS" = "30" ]; then
              echo "Silver deploy failed: $RUN_URL"
              exit 1
            fi
          done

          echo "Timed out waiting for Silver job"
          exit 1

      - name: Post Silver deployment summary
        if: always()
        run: |
          echo "### Silver Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **dbt Cloud Run:** ${{ steps.trigger_silver.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────
  # JOB 3: Deploy Gold Layer after Silver succeeds
  # ───────────────────────────────────────────
  dbt-prod-gold:
    name: dbt Cloud Production Deploy — Gold
    runs-on: ubuntu-latest
    needs: dbt-prod-silver  # Gold only runs after Silver succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger dbt Cloud Gold Job
        id: trigger_gold
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PROD_GOLD_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cause": "Gold deploy — merge to main by ${{ github.actor }} — commit ${{ github.sha }}",
              "git_sha": "${{ github.sha }}"
            }')

          echo "Response: $RESPONSE"
          RUN_ID=$(echo $RESPONSE | jq -r '.data.id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered Gold run: $RUN_ID"

      - name: Wait for Gold Job to complete
        id: wait_for_gold
        run: |
          RUN_ID=${{ steps.trigger_gold.outputs.run_id }}
          RUN_URL="${{ env.DBT_CLOUD_HOST }}/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID"
          echo "Polling Gold run: $RUN_URL"

          for i in $(seq 1 80); do
            sleep 30
            STATUS_RESPONSE=$(curl -s \
              "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              -H "Authorization: Token ${{ secrets.DBT_API_KEY }}")

            STATUS=$(echo $STATUS_RESPONSE | jq -r '.data.status')
            echo "Attempt $i — Status code: $STATUS"

            if [ "$STATUS" = "10" ]; then
              echo "Gold deploy succeeded: $RUN_URL"
              exit 0
            elif [ "$STATUS" = "20" ] || [ "$STATUS" = "30" ]; then
              echo "Gold deploy failed: $RUN_URL"
              exit 1
            fi
          done

          echo "Timed out waiting for Gold job"
          exit 1

      - name: Post Gold deployment summary
        if: always()
        run: |
          echo "### Gold Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **dbt Cloud Run:** ${{ steps.trigger_gold.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
