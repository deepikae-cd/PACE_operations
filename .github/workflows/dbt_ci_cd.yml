name: dbt Cloud CI/CD Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  DBT_CLOUD_HOST: https://br531.us1.dbt.com

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1: CI — Runs on every PR open/update BEFORE merge
  # ─────────────────────────────────────────────────────────────
  dbt-ci:
    name: dbt Cloud CI (Slim CI on PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Trigger dbt Cloud CI Job
        id: trigger_ci
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PR_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cause": "GitHub Actions CI — PR #${{ github.event.pull_request.number }}",
              "git_sha": "${{ github.event.pull_request.head.sha }}",
              "github_pull_request_id": ${{ github.event.pull_request.number }}
            }')

          echo "Full Response: $RESPONSE"

          RUN_ID=$(echo $RESPONSE | jq -r '.data.id')

          if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
            echo "❌ Failed to get RUN_ID. Full response above."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ Triggered CI run: $RUN_ID"

      - name: Wait for dbt Cloud CI Job to complete
        run: |
          RUN_ID=${{ steps.trigger_ci.outputs.run_id }}
          echo "Polling CI run $RUN_ID..."

          for i in $(seq 1 60); do
            sleep 30
            STATUS_RESPONSE=$(curl -s \
              "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}")

            STATUS=$(echo $STATUS_RESPONSE | jq -r '.data.status')
            STATUS_MESSAGE=$(echo $STATUS_RESPONSE | jq -r '.data.status_message')
            RUN_URL=$(echo $STATUS_RESPONSE | jq -r '.data.href')

            echo "Attempt $i — Status: $STATUS ($STATUS_MESSAGE)"

            # dbt Cloud status codes: 1=Queued, 2=Starting, 3=Running, 10=Success, 20=Error, 30=Cancelled
            if [ "$STATUS" = "10" ]; then
              echo "✅ CI job succeeded"
              exit 0
            elif [ "$STATUS" = "20" ] || [ "$STATUS" = "30" ]; then
              echo "❌ CI job failed. See: $RUN_URL"
              exit 1
            fi
          done

          echo "⏱️ Timed out waiting for CI job"
          exit 1

      - name: Post CI summary
        if: always()
        run: |
          echo "### CI Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.event.pull_request.head.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **dbt Cloud Run:** ${{ steps.trigger_ci.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # JOB 2: PRODUCTION SILVER — Runs after PR is merged into main
  # ─────────────────────────────────────────────────────────────
  dbt-prod-silver:
    name: dbt Cloud Production — Silver Pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Trigger dbt Cloud Silver Production Job
        id: trigger_silver
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PROD_SILVER_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cause": "GitHub Actions — merge to main by ${{ github.actor }} — commit ${{ github.sha }}"
            }')

          echo "Full Response: $RESPONSE"

          RUN_ID=$(echo $RESPONSE | jq -r '.data.id')

          if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
            echo "❌ Failed to trigger Silver job. Full response above."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ Triggered Silver production run: $RUN_ID"

      - name: Wait for Silver Production Job to complete
        run: |
          RUN_ID=${{ steps.trigger_silver.outputs.run_id }}
          echo "Polling Silver run $RUN_ID..."

          for i in $(seq 1 80); do
            sleep 30
            STATUS_RESPONSE=$(curl -s \
              "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}")

            STATUS=$(echo $STATUS_RESPONSE | jq -r '.data.status')
            STATUS_MESSAGE=$(echo $STATUS_RESPONSE | jq -r '.data.status_message')
            RUN_URL=$(echo $STATUS_RESPONSE | jq -r '.data.href')

            echo "Attempt $i — Status: $STATUS ($STATUS_MESSAGE)"

            if [ "$STATUS" = "10" ]; then
              echo "✅ Silver production job succeeded"
              exit 0
            elif [ "$STATUS" = "20" ] || [ "$STATUS" = "30" ]; then
              echo "❌ Silver production job failed. See: $RUN_URL"
              exit 1
            fi
          done

          echo "⏱️ Timed out waiting for Silver job"
          exit 1

      - name: Post Silver summary
        if: always()
        run: |
          echo "### Silver Production Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **dbt Cloud Run:** ${{ steps.trigger_silver.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # JOB 3: PRODUCTION GOLD — Runs after Silver succeeds
  # ─────────────────────────────────────────────────────────────
  dbt-prod-gold:
    name: dbt Cloud Production — Gold Pipeline
    runs-on: ubuntu-latest
    needs: dbt-prod-silver          # Gold runs only after Silver succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Trigger dbt Cloud Gold Production Job
        id: trigger_gold
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PROD_GOLD_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cause": "GitHub Actions — merge to main by ${{ github.actor }} — commit ${{ github.sha }}"
            }')

          echo "Full Response: $RESPONSE"

          RUN_ID=$(echo $RESPONSE | jq -r '.data.id')

          if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
            echo "❌ Failed to trigger Gold job. Full response above."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ Triggered Gold production run: $RUN_ID"

      - name: Wait for Gold Production Job to complete
        run: |
          RUN_ID=${{ steps.trigger_gold.outputs.run_id }}
          echo "Polling Gold run $RUN_ID..."

          for i in $(seq 1 80); do
            sleep 30
            STATUS_RESPONSE=$(curl -s \
              "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              -H "Authorization: Token ${{ secrets.DBT_CLOUD_SERVICE_TOKEN }}")

            STATUS=$(echo $STATUS_RESPONSE | jq -r '.data.status')
            STATUS_MESSAGE=$(echo $STATUS_RESPONSE | jq -r '.data.status_message')
            RUN_URL=$(echo $STATUS_RESPONSE | jq -r '.data.href')

            echo "Attempt $i — Status: $STATUS ($STATUS_MESSAGE)"

            if [ "$STATUS" = "10" ]; then
              echo "✅ Gold production job succeeded"
              exit 0
            elif [ "$STATUS" = "20" ] || [ "$STATUS" = "30" ]; then
              echo "❌ Gold production job failed. See: $RUN_URL"
              exit 1
            fi
          done

          echo "⏱️ Timed out waiting for Gold job"
          exit 1

      - name: Post Gold summary
        if: always()
        run: |
          echo "### Gold Production Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **dbt Cloud Run:** ${{ steps.trigger_gold.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
