name: dbt Docker CI/CD Pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

jobs:

  #  DEV
  dbt-dev:
    name: dbt Dev
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run dbt (dev)
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/usr/app \
          -w /usr/app/PACE_operations_medallion \
          -e DBT_ACCOUNT=${{ secrets.DEV_DBT_ACCOUNT }} \
          -e DBT_USER=${{ secrets.DEV_DBT_USER }} \
          -e DBT_PASSWORD=${{ secrets.DEV_DBT_PASSWORD }} \
          -e DEV_DBT_ROLE=${{ secrets.DEV_DBT_ROLE }} \
          -e DEV_DBT_DATABASE=${{ secrets.DEV_DBT_DATABASE }} \
          -e DEV_DBT_WAREHOUSE=${{ secrets.DEV_DBT_WAREHOUSE }} \
          --entrypoint bash \
          ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
          -c "echo 'Running dbt run (DEV)...' && \
              dbt deps && \
              dbt run --target dev --profiles-dir /usr/app --fail-fast && \
              echo 'Running dbt test (DEV)...' && \
              dbt test --target dev --profiles-dir /usr/app"


  #  STAGING
  dbt-staging:
    name: dbt Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run dbt (staging)
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/usr/app \
          -w /usr/app/PACE_operations_medallion \
          -e DBT_ACCOUNT=${{ secrets.STG_DBT_ACCOUNT }} \
          -e DBT_USER=${{ secrets.STG_DBT_USER }} \
          -e DBT_PASSWORD=${{ secrets.STG_DBT_PASSWORD }} \
          -e STG_DBT_ROLE=${{ secrets.STG_DBT_ROLE }} \
          -e STG_DBT_DATABASE=${{ secrets.STG_DBT_DATABASE }} \
          -e STG_DBT_WAREHOUSE=${{ secrets.STG_DBT_WAREHOUSE }} \
          --entrypoint bash \
          ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
          -c "echo 'Running dbt run (STAGING)...' && \
              dbt deps && \
              dbt run --target staging --profiles-dir /usr/app --fail-fast && \
              echo 'Running dbt test (STAGING)...' && \
              dbt test --target staging --profiles-dir /usr/app"


  #  PROD
  dbt-prod:
    name: dbt Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Run dbt (prod)
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/usr/app \
          -w /usr/app/PACE_operations_medallion \
          -e DBT_ACCOUNT=${{ secrets.PROD_DBT_ACCOUNT }} \
          -e DBT_USER=${{ secrets.PROD_DBT_USER }} \
          -e DBT_PASSWORD=${{ secrets.PROD_DBT_PASSWORD }} \
          -e PROD_DBT_ROLE=${{ secrets.PROD_DBT_ROLE }} \
          -e PROD_DBT_DATABASE=${{ secrets.PROD_DBT_DATABASE }} \
          -e PROD_DBT_WAREHOUSE=${{ secrets.PROD_DBT_WAREHOUSE }} \
          --entrypoint bash \
          ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
          -c "echo 'Running dbt run (PROD)...' && \
              dbt deps && \
              dbt run --target prod --profiles-dir /usr/app --fail-fast && \
              echo 'Running dbt test (PROD)...' && \
              dbt test --target prod --profiles-dir /usr/app"
