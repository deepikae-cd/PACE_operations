name: dbt Docker CI/CD Pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

jobs:

  dbt-dev:
    name: dbt Dev
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Run dbt (dev)
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/usr/app \
          -w /usr/app/PACE_operations_medallion \
          -e DBT_ACCOUNT=${{ secrets.DEV_DBT_ACCOUNT }} \
          -e DBT_USER=${{ secrets.DEV_DBT_USER }} \
          -e DBT_PASSWORD=${{ secrets.DEV_DBT_PASSWORD }} \
          -e DBT_ROLE=${{ secrets.DEV_DBT_ROLE }} \
          -e DBT_DATABASE=${{ secrets.DEV_DBT_DATABASE }} \
          -e DBT_WAREHOUSE=${{ secrets.DEV_DBT_WAREHOUSE }} \
          ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
          sh -c "dbt deps && dbt build --target dev --fail-fast"

  dbt-staging:
    name: dbt Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Run dbt (staging)
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/usr/app \
          -w /usr/app/PACE_operations_medallion \
          -e DBT_ACCOUNT=${{ secrets.STG_DBT_ACCOUNT }} \
          -e DBT_USER=${{ secrets.STG_DBT_USER }} \
          -e DBT_PASSWORD=${{ secrets.STG_DBT_PASSWORD }} \
          -e DBT_ROLE=${{ secrets.STG_DBT_ROLE }} \
          -e DBT_DATABASE=${{ secrets.STG_DBT_DATABASE }} \
          -e DBT_WAREHOUSE=${{ secrets.STG_DBT_WAREHOUSE }} \
          ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
          sh -c "dbt deps && dbt build --target staging --fail-fast"

  dbt-prod:
    name: dbt Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Run dbt (prod)
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/usr/app \
          -w /usr/app/PACE_operations_medallion \
          -e DBT_ACCOUNT=${{ secrets.PROD_DBT_ACCOUNT }} \
          -e DBT_USER=${{ secrets.PROD_DBT_USER }} \
          -e DBT_PASSWORD=${{ secrets.PROD_DBT_PASSWORD }} \
          -e DBT_ROLE=${{ secrets.PROD_DBT_ROLE }} \
          -e DBT_DATABASE=${{ secrets.PROD_DBT_DATABASE }} \
          -e DBT_WAREHOUSE=${{ secrets.PROD_DBT_WAREHOUSE }} \
          ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
          sh -c "dbt deps && dbt build --target prod --fail-fast"
