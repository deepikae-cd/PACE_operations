name: dbt Cloud Production Deploy — Gold

on:
  schedule:
    - cron: '30 * * * *'  # Every hour at :30 (offset from Silver to avoid overlap)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

env:
  DBT_CLOUD_HOST: https://cloud.getdbt.com

jobs:
  dbt-prod-gold:
    name: dbt Cloud Production Deploy — Gold
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger dbt Cloud Gold Job
        id: trigger_gold
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_PROD_GOLD_JOB_ID }}/run/" \
            -H "Authorization: Token ${{ secrets.DBT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cause": "Scheduled hourly Gold run"
            }')

          echo "Response: $RESPONSE"
          RUN_ID=$(echo $RESPONSE | jq -r '.data.id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered Gold run: $RUN_ID"

      - name: Wait for Gold Job to complete
        run: |
          RUN_ID=${{ steps.trigger_gold.outputs.run_id }}
          RUN_URL="${{ env.DBT_CLOUD_HOST }}/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID"
          echo "Polling Gold run: $RUN_URL"

          for i in $(seq 1 80); do
            sleep 30
            STATUS_RESPONSE=$(curl -s \
              "${{ env.DBT_CLOUD_HOST }}/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              -H "Authorization: Token ${{ secrets.DBT_API_KEY }}")

            STATUS=$(echo $STATUS_RESPONSE | jq -r '.data.status')
            echo "Attempt $i — Status code: $STATUS"

            # dbt Cloud status codes: 1=Queued, 2=Starting, 3=Running, 10=Success, 20=Error, 30=Cancelled
            if [ "$STATUS" = "10" ]; then
              echo "Gold deploy succeeded: $RUN_URL"
              exit 0
            elif [ "$STATUS" = "20" ] || [ "$STATUS" = "30" ]; then
              echo "Gold deploy failed: $RUN_URL"
              exit 1
            fi
          done

          echo "Timed out waiting for Gold job"
          exit 1

      - name: Post Gold deployment summary
        if: always()
        run: |
          echo "### Gold Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Scheduled run at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **dbt Cloud Run:** ${{ steps.trigger_gold.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
