name: dbt CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  release:
    types: [ created ]

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: true

jobs:

  dbt-dev:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: dbt dev pipeline
        run: |
          docker run --rm \
            --entrypoint bash \
            -v ${{ github.workspace }}:/usr/app \
            -e DBT_ACCOUNT=${{ secrets.DBT_ACCOUNT }} \
            -e DBT_USER=${{ secrets.DBT_USER }} \
            -e DBT_PASSWORD=${{ secrets.DBT_PASSWORD }} \
            -e DBT_ROLE=${{ secrets.DBT_ROLE }} \
            -e DBT_WAREHOUSE=${{ secrets.DBT_DEV_WAREHOUSE }} \
            -e DBT_DATABASE=${{ secrets.DBT_DEV_DATABASE }} \
            ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
            -c "
              dbt debug --project-dir /usr/app/PACE_operations_medallion --profiles-dir /usr/app --target dev && \
              dbt deps --project-dir /usr/app/PACE_operations_medallion && \
              dbt build --threads 2 --fail-fast --debug \
                --project-dir /usr/app/PACE_operations_medallion \
                --profiles-dir /usr/app \
                --target dev
            "

  dbt-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: dbt staging pipeline
        run: |
          docker run --rm \
            --entrypoint bash \
            -v ${{ github.workspace }}:/usr/app \
            -e DBT_ACCOUNT=${{ secrets.DBT_ACCOUNT }} \
            -e DBT_USER=${{ secrets.DBT_USER }} \
            -e DBT_PASSWORD=${{ secrets.DBT_PASSWORD }} \
            -e DBT_ROLE=${{ secrets.DBT_ROLE }} \
            -e DBT_WAREHOUSE=${{ secrets.DBT_STG_WAREHOUSE }} \
            -e DBT_DATABASE=${{ secrets.DBT_STG_DATABASE }} \
            ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
            -c "
              dbt debug --project-dir /usr/app/PACE_operations_medallion --profiles-dir /usr/app --target stg && \
              dbt deps --project-dir /usr/app/PACE_operations_medallion && \
              dbt build --threads 2 --fail-fast --debug \
                --project-dir /usr/app/PACE_operations_medallion \
                --profiles-dir /usr/app \
                --target stg
            "

  dbt-prod:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: dbt prod pipeline
        run: |
          docker run --rm \
            --entrypoint bash \
            -v ${{ github.workspace }}:/usr/app \
            -e DBT_ACCOUNT=${{ secrets.DBT_ACCOUNT }} \
            -e DBT_USER=${{ secrets.DBT_USER }} \
            -e DBT_PASSWORD=${{ secrets.DBT_PASSWORD }} \
            -e DBT_ROLE=${{ secrets.DBT_ROLE }} \
            -e DBT_WAREHOUSE=${{ secrets.DBT_PROD_WAREHOUSE }} \
            -e DBT_DATABASE=${{ secrets.DBT_PROD_DATABASE }} \
            ghcr.io/dbt-labs/dbt-snowflake:1.9.latest \
            -c "
              dbt debug --project-dir /usr/app/PACE_operations_medallion --profiles-dir /usr/app --target prod && \
              dbt deps --project-dir /usr/app/PACE_operations_medallion && \
              dbt build --threads 2 --fail-fast --debug \
                --project-dir /usr/app/PACE_operations_medallion \
                --profiles-dir /usr/app \
                --target prod
            "
