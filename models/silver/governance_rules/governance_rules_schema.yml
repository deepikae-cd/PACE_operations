version: 2

models:
  - name: governance_rules
    description: >
      Governance rules dataset used for system-wide compliance and operational controls.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: rule_id
        tests:
          - not_null
          - unique

      - name: rule_name
        tests:
          - not_null

      - name: rule_type

      - name: rule_status
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'INACTIVE']

      - name: source_created_ts
      - name: load_ts
      - name: active_flag
      - name: inactive_flag