version: 2

models:
  - name: transportation
    description: >
      Silver-layer transportation dataset tracking participant trips,
      statuses, and completion outcomes.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: transportation_id
        description: Unique identifier for transportation record.

      - name: participant_id
        description: Participant associated with trip.

      - name: provider_id
        description: Transport provider identifier.

      - name: trip_date
        description: Scheduled or completed trip date.

      - name: trip_type
        description: Type of transportation service.

      - name: trip_status
        description: Normalized status of trip.

      - name: source_created_ts
        description: Source system timestamp.

      - name: load_ts
        description: Silver layer ingestion timestamp.

      - name: completed_flag
        description: Indicates completed trips.

      - name: cancelled_flag
        description: Indicates cancelled trips.