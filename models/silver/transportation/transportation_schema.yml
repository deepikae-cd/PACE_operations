version: 2

models:
  - name: transportation
    description: Transportation dataset tracking trips, status, and outcomes.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: transportation_id
        tests:
          - not_null
          - unique

      - name: participant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('participant')
                field: participant_id

      - name: provider_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('provider')
                field: provider_id

      - name: trip_date
        tests:
          - not_null

      - name: trip_type

      - name: trip_status
        tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'CANCELLED', 'SCHEDULED']

      - name: source_created_ts
      - name: load_ts
      - name: completed_flag
      - name: cancelled_flag