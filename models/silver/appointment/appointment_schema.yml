version: 2

models:
  - name: appointment
    description: >
      Silver-layer curated appointment dataset with standardized attributes,
      derived flags, and business-level categorization.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: appointment_id
        description: Unique identifier for appointment.
        tests:
          - not_null
          - unique

      - name: participant_id
        description: Participant associated with appointment.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('participant')
                field: participant_id

      - name: provider_id
        description: Provider responsible for appointment.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('provider')
                field: provider_id

      - name: appointment_date
        description: Scheduled date of appointment.
        tests:
          - not_null

      - name: service_type
        description: Standardized service type.

      - name: appointment_status
        description: Normalized appointment status.
        tests:
          - accepted_values:
              values: ['COMPLETED', 'CANCELLED', 'SCHEDULED', 'IN_PROGRESS']

      - name: source_created_ts
      - name: load_ts
      - name: completed_flag
      - name: cancelled_flag
      - name: appointment_category