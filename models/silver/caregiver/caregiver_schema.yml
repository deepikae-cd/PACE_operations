version: 2

models:
  - name: caregiver
    description: >
      Silver-layer caregiver master dataset containing standardized caregiver identity
      and role attributes.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: caregiver_id
        description: Unique identifier for caregiver.
        tests:
          - not_null
          - unique

      - name: first_name
        description: Caregiver first name.
        tests:
          - not_null

      - name: last_name
        description: Caregiver last name.

      - name: caregiver_role
        description: Role/designation of caregiver.

      - name: source_created_ts
      - name: load_ts