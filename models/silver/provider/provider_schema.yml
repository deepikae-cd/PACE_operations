version: 2

models:
  - name: provider
    description: Provider master dataset with specialty and operational status.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: provider_id
        tests:
          - not_null
          - unique

      - name: provider_name
        tests:
          - not_null

      - name: specialty

      - name: provider_status
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'INACTIVE']

      - name: source_created_ts
      - name: load_ts
      - name: active_flag