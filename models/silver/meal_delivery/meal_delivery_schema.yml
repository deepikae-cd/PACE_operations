version: 2

models:
  - name: meal_delivery
    description: >
      Silver-layer dataset tracking meal delivery outcomes, status, and timeliness.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: meal_delivery_id
        tests:
          - not_null
          - unique

      - name: participant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('participant')
                field: participant_id

      - name: provider_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('provider')
                field: provider_id

      - name: delivery_date
        tests:
          - not_null

      - name: meal_type

      - name: delivery_status
        tests:
          - accepted_values:
              arguments:
                values: ['DELIVERED', 'FAILED', 'PENDING']

      - name: source_created_ts
      - name: load_ts
      - name: delivered_flag
      - name: failed_flag
      - name: delivery_category