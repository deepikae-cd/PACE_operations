version: 2

models:
  - name: notification
    description: >
      Silver-layer notification tracking dataset capturing message delivery status
      for participants.

    config:
      schema: SILVER
      materialized: table

    columns:
      - name: notification_id
        description: Unique identifier for notification.
        tests:
          - not_null
          - unique

      - name: participant_id
        description: Recipient participant identifier.
        tests:
          - not_null
          - relationships:
              to: ref('participant')
              field: participant_id

      - name: notification_type
      - name: notification_status
        tests:
          - accepted_values:
              values: ['SENT', 'FAILED', 'PENDING']

      - name: source_created_ts
      - name: load_ts

      - name: sent_flag
      - name: failed_flag